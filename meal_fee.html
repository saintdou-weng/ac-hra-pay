<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 Meal Fee Analytics | AC-HRA-PAY</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC','Segoe UI',sans-serif;background:#f6f8fb;}
  .jmono{font-family:'IBM Plex Mono',monospace;}
  .km{font-family:'Noto Sans Khmer',sans-serif;}
  .tab-active{border-bottom:2.5px solid #0284c7;color:#0369a1;font-weight:700;}
  .tab-inactive{border-bottom:2.5px solid transparent;color:#64748b;}
  .ch260{height:260px;}
  .anim{animation:fade .35s ease both;}
  .anim-1{animation-delay:.05s;} .anim-2{animation-delay:.1s;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  @media print{.no-print{display:none!important}}
</style>
</head>
<body class="text-slate-800">

<!-- ═══════════ HEADER ═══════════ -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
  <div class="max-w-screen-2xl mx-auto px-4 py-2.5 flex flex-wrap items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-white font-bold text-lg shrink-0">🍱</div>
    <div class="mr-2">
      <h1 class="text-base font-bold leading-tight">Meal Fee Analytics</h1>
      <p class="text-[10px] text-slate-400 mt-0.5">Vantage River Textiles · Phnom Penh
        <span class="ml-1 px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600 font-mono border border-emerald-100">v2.2</span></p>
    </div>

    <div class="flex items-center gap-1.5 ml-auto flex-wrap">
      <!-- ☁ 雲端 -->
      <div class="no-print flex items-center rounded-md border border-sky-200 bg-sky-50 overflow-hidden">
        <button id="btn-cloud-up" onclick="cloudUpload()" title="上傳至雲端 Upload to cloud"
          class="flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 text-sky-700 hover:bg-sky-100 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6H16a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          <span class="hidden md:inline" data-en="Upload">上傳</span>
        </button>
        <span class="w-px h-4 bg-sky-200"></span>
        <button id="btn-cloud-down" onclick="cloudDownload()" title="從雲端下載 Download from cloud"
          class="flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 text-sky-700 hover:bg-sky-100 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6H16a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/></svg>
          <span class="hidden md:inline" data-en="Download">下載</span>
        </button>
      </div>
      <!-- ✈️ Telegram -->
      <button onclick="openTgModal()" title="傳送至 Telegram"
        class="no-print flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded-md border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">
        ✈️ <span data-en="Telegram">傳送</span>
      </button>
      <button onclick="clearAllData()" title="清除所有資料"
        class="no-print flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 rounded-md border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 transition">
        🗑 <span class="hidden sm:inline" data-en="Clear All">清除全部</span>
      </button>
      <button onclick="exportJSON()" class="no-print text-xs font-medium px-2.5 py-1.5 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50 transition">
        ⬇ <span class="hidden sm:inline" data-en="Export">匯出</span>
      </button>
      <button onclick="toggleLang()" class="no-print text-xs font-semibold px-3 py-1.5 rounded-md bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100 transition">中/EN</button>
    </div>
  </div>
</header>

<!-- ═══════════ SMART IMPORT ═══════════ -->
<div class="bg-gradient-to-r from-orange-50 via-white to-emerald-50 border-b border-slate-100 no-print">
  <div class="max-w-screen-2xl mx-auto px-4 py-3">
    <label id="dz-smart" class="flex flex-wrap items-center gap-3 border-2 border-dashed border-orange-300 rounded-xl px-4 py-3 cursor-pointer hover:border-orange-500 hover:bg-orange-50/60 transition group">
      <div class="w-10 h-10 rounded-lg bg-orange-100 flex items-center justify-center shrink-0 group-hover:bg-orange-200 transition"><span class="text-xl">🪄</span></div>
      <div class="flex-1 min-w-[220px]">
        <p class="text-sm font-bold text-orange-800" data-en="Smart Import — just drop any files here">智慧匯入 — 檔案直接丟進來就好</p>
        <p class="text-[11px] text-slate-500 mt-0.5" data-en="Meal-fee workbooks and attendance sheets, any number at once. Period and half-month batch are detected automatically.">
          餐費表、考勤表都可以，一次選多個檔。系統自動辨識月份與上／下半月，不必分開上傳。</p>
        <p id="smart-status" class="text-[11px] mt-1 font-medium"></p>
      </div>
      <span class="text-xs font-semibold px-3 py-2 rounded-lg bg-orange-600 text-white shrink-0 group-hover:bg-orange-700 transition" data-en="Choose files">選擇檔案</span>
      <input type="file" accept=".xlsx,.xls,.XLS" multiple class="hidden" onchange="smartImport(this)">
    </label>
    <div id="smart-report" class="hidden mt-2 text-[11px] bg-white border border-slate-200 rounded-lg p-2.5 space-y-1"></div>
  </div>
</div>

<!-- ═══════════ TABS ═══════════ -->
<div class="bg-white border-b border-slate-200 sticky top-[57px] z-30 no-print">
  <div class="max-w-screen-2xl mx-auto px-4 flex gap-1 overflow-x-auto">
    <button id="tab-dash"   onclick="goTab('dash')"   class="tab-active text-sm px-4 py-3 whitespace-nowrap transition" data-en="📊 Dashboard">📊 儀表板</button>
    <button id="tab-daily"  onclick="goTab('daily')"  class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="📅 Time Detail">📅 時間明細</button>
    <button id="tab-dept"   onclick="goTab('dept')"   class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="🏭 By Department">🏭 部門分析</button>
    <button id="tab-roster" onclick="goTab('roster')" class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="👥 Roster">👥 員工名單</button>
    <button id="tab-recon"  onclick="goTab('recon')"  class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="🔍 Reconcile">🔍 考勤核對</button>
    <button id="tab-report" onclick="goTab('report')" class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="📋 Period Report">📋 期間報表</button>
  </div>
</div>

<main class="max-w-screen-2xl mx-auto px-4 py-4">

<!-- 空狀態 -->
<div id="empty-state" class="flex flex-col items-center justify-center py-28 text-center">
  <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mb-4"><span class="text-3xl">🍱</span></div>
  <p class="text-slate-400 font-medium" data-en="Upload meal-fee or attendance files to begin">上傳餐費表或考勤表後開始分析</p>
  <p class="text-slate-300 text-xs mt-2" data-en="Both file types are auto-detected — no need to sort them yourself.">兩種檔案都會自動辨識，不用自己分類</p>
</div>

<div id="app" class="hidden">

  <!-- ══ 期間導覽 ══ -->
  <div class="mb-4 bg-white border border-slate-200 rounded-xl p-3 space-y-2.5">
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="stepPeriod(-1)" title="上一期"
        class="w-9 h-9 rounded-lg border border-slate-200 hover:bg-slate-50 hover:border-orange-400 transition flex items-center justify-center text-slate-500 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <select id="nav-period" onchange="jumpPeriod(this.value)"
        class="text-sm font-bold border border-slate-200 rounded-lg px-4 py-2 bg-white focus:ring-2 focus:ring-orange-200 outline-none min-w-[210px] text-center"></select>
      <button onclick="stepPeriod(1)" title="下一期"
        class="w-9 h-9 rounded-lg border border-slate-200 hover:bg-slate-50 hover:border-orange-400 transition flex items-center justify-center text-slate-500 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>
      <span id="nav-hint" class="text-[11px] ml-1"></span>
      <select id="sel-dept" onchange="renderAll()"
        class="ml-auto text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-orange-200 outline-none min-w-[180px]">
        <option value="" data-en="All Departments">全廠 All Departments</option>
      </select>
    </div>
    <div class="flex flex-wrap items-center gap-2.5">
      <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider w-14" data-en="Time">時間</span>
      <div class="flex bg-slate-100 rounded-lg p-0.5">
        <button id="cu-day"   onclick="setUnit('day')"   data-en="Daily"     class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每日</button>
        <button id="cu-week"  onclick="setUnit('week')"  data-en="Weekly"    class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每週</button>
        <button id="cu-half"  onclick="setUnit('half')"  data-en="Half-month" class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-orange-700 transition">本期</button>
        <button id="cu-month" onclick="setUnit('month')" data-en="Monthly"   class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每月</button>
        <button id="cu-year"  onclick="setUnit('year')"  data-en="Yearly"    class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每年</button>
      </div>
      <div class="flex bg-slate-100 rounded-lg p-0.5">
        <button id="cm-total" onclick="setMode('total')" data-en="Total"      class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-sky-700 transition">總額</button>
        <button id="cm-cap"   onclick="setMode('cap')"   data-en="Per Capita" class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">人均</button>
      </div>
      <span id="scope-txt" class="text-[11px] text-slate-400 ml-auto"></span>
    </div>
  </div>

  <!-- ────── DASHBOARD ────── -->
  <div id="pane-dash" class="pane">
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p class="text-[11px] text-slate-400 font-medium" data-en="HEADCOUNT">總人數 HEADCOUNT</p>
        <p id="kpi-head" class="text-2xl font-bold jmono mt-1">—</p>
        <p id="kpi-head-sub" class="text-[11px] text-slate-400 mt-0.5"></p>
      </div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p class="text-[11px] text-slate-400 font-medium" data-en="TOTAL MEAL FEE">餐費總額 TOTAL</p>
        <p id="kpi-usd" class="text-2xl font-bold jmono mt-1 text-orange-600">—</p>
        <p id="kpi-usd-sub" class="text-[11px] text-slate-400 mt-0.5"></p>
      </div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p class="text-[11px] text-slate-400 font-medium" data-en="RIEL TOTAL">瑞爾合計 RIEL</p>
        <p id="kpi-riel" class="text-2xl font-bold jmono mt-1 text-slate-600">—</p>
        <p id="kpi-rate" class="text-[11px] text-slate-400 mt-0.5"></p>
      </div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p class="text-[11px] text-slate-400 font-medium" data-en="AVG PER PERSON">平均每人 AVG</p>
        <p id="kpi-avg" class="text-2xl font-bold jmono mt-1 text-emerald-600">—</p>
        <p id="kpi-avg-sub" class="text-[11px] text-slate-400 mt-0.5"></p>
      </div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-2">
        <p class="text-[11px] text-slate-400 font-medium" data-en="MEAL DAYS">用餐人日 MEAL-DAYS</p>
        <p id="kpi-mdays" class="text-2xl font-bold jmono mt-1 text-sky-600">—</p>
        <p id="kpi-mdays-sub" class="text-[11px] text-slate-400 mt-0.5"></p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p class="text-sm font-semibold text-slate-700 mb-1" data-en="Daily Meal Fee Trend">每日餐費趨勢</p>
        <p id="trend-note" class="text-[11px] text-slate-400 mb-3"></p>
        <div class="ch260"><canvas id="trend-chart"></canvas></div>
      </div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p class="text-sm font-semibold text-slate-700 mb-1" data-en="Meal Fee by Department">各部門餐費</p>
        <p class="text-[11px] text-slate-400 mb-3" data-en="Top 15 departments">前 15 個部門</p>
        <div class="ch260"><canvas id="dept-chart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- ────── DAILY ────── -->
  <div id="pane-daily" class="pane hidden">
    <!-- 當期彙總卡片 -->
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p id="td-c1-l" class="text-[11px] text-slate-400 font-medium">—</p>
        <p id="td-c1" class="text-xl font-bold jmono mt-1">—</p>
        <p id="td-c1s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p id="td-c2-l" class="text-[11px] text-slate-400 font-medium">—</p>
        <p id="td-c2" class="text-xl font-bold jmono mt-1 text-orange-600">—</p>
        <p id="td-c2s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p id="td-c3-l" class="text-[11px] text-slate-400 font-medium">—</p>
        <p id="td-c3" class="text-xl font-bold jmono mt-1 text-sky-600">—</p>
        <p id="td-c3s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p id="td-c4-l" class="text-[11px] text-slate-400 font-medium">—</p>
        <p id="td-c4" class="text-xl font-bold jmono mt-1 text-emerald-600">—</p>
        <p id="td-c4s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-2">
        <p id="td-c5-l" class="text-[11px] text-slate-400 font-medium">—</p>
        <p id="td-c5" class="text-xl font-bold jmono mt-1 text-amber-600">—</p>
        <p id="td-c5s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
    </div>
    <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <p id="daily-title" class="text-sm font-semibold text-slate-700 flex-1">📅 每日明細</p>
        <span id="daily-src" class="text-[11px] px-2 py-0.5 rounded-full"></span>
      </div>
      <div id="daily-note" class="px-4 py-2 text-[11px] text-slate-500 bg-slate-50 border-b border-slate-100"></div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead class="bg-slate-50 text-slate-500"><tr id="daily-thead"></tr></thead>
          <tbody id="daily-tbody"></tbody>
          <tfoot class="bg-slate-50 font-bold text-slate-700 border-t-2 border-slate-200"><tr id="daily-tfoot"></tr></tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- ────── DEPARTMENT ────── -->
  <div id="pane-dept" class="pane hidden">
    <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <p class="text-sm font-semibold text-slate-700 flex-1" data-en="🏭 Department Breakdown">🏭 各部門明細</p>
        <button onclick="exportCSV('dept')" class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition">⬇ CSV</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead class="bg-slate-50 text-slate-500"><tr id="dept-thead"></tr></thead>
          <tbody id="dept-tbody"></tbody>
          <tfoot class="bg-slate-50 font-bold text-slate-700 border-t-2 border-slate-200"><tr id="dept-tfoot"></tr></tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- ────── ROSTER ────── -->
  <div id="pane-roster" class="pane hidden">
    <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <input id="roster-q" oninput="renderRoster()" placeholder="搜尋 ID / 姓名 / 部門…"
          class="text-sm border border-slate-200 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-orange-200 flex-1 min-w-[200px]">
        <select id="roster-sort" onchange="renderRoster()" class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white outline-none">
          <option value="usd" data-en="Sort: Amount ↓">排序：金額 ↓</option>
          <option value="days" data-en="Sort: Meal days ↓">排序：用餐天數 ↓</option>
          <option value="id" data-en="Sort: ID">排序：工號</option>
        </select>
        <span id="roster-count" class="text-[11px] text-slate-400"></span>
        <button onclick="exportCSV('roster')" class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition">⬇ CSV</button>
      </div>
      <div class="overflow-x-auto max-h-[70vh] overflow-y-auto">
        <table class="w-full text-xs">
          <thead class="bg-slate-50 text-slate-500 sticky top-0"><tr id="roster-thead"></tr></thead>
          <tbody id="roster-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ────── RECONCILE ────── -->
  <div id="pane-recon" class="pane hidden">
    <div id="recon-body"></div>
  </div>

  <!-- ────── PERIOD REPORT ────── -->
  <div id="pane-report" class="pane hidden">
    <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <p class="text-sm font-semibold text-slate-700 flex-1" data-en="📋 Period Report">📋 期間報表</p>
        <div class="flex bg-slate-100 rounded-lg p-0.5">
          <button id="rp-half"  onclick="setReportMode('half')"  data-en="Half-month" class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-orange-700 transition">半月</button>
          <button id="rp-month" onclick="setReportMode('month')" data-en="Monthly"    class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">月報</button>
          <button id="rp-year"  onclick="setReportMode('year')"  data-en="Yearly"     class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">年報</button>
        </div>
        <span id="rp-count" class="text-[11px] text-slate-400"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead class="bg-slate-50 text-slate-500"><tr id="rp-thead"></tr></thead>
          <tbody id="rp-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div><!-- /app -->
</main>

<!-- ═══════════ TELEGRAM MODAL ═══════════ -->
<div id="tg-modal" class="fixed inset-0 z-[1000] hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm no-print p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">

<script>
'use strict';
// ═══════════════════════════════════════════════════════
//  AC-HRA-PAY · Meal Fee Analytics v2.0
// ═══════════════════════════════════════════════════════
const GAS_URL = localStorage.getItem('hrpay_gas_url') ||
  'https://script.google.com/macros/s/AKfycbwmmRduvOe5RdnR_iALwEIi_6lQaTq4SXH88jmoIjiHwTsTrW5qnlPTr8PSmOT7C2rdGg/exec';

const IDB_NAME='ac_hra_meal', IDB_VER=1, IDB_STORE='batches';
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PALETTE=['#f97316','#0ea5e9','#10b981','#8b5cf6','#f43f5e','#eab308','#14b8a6','#6366f1','#ec4899','#84cc16'];

let LANG='zh';
let STORE={};          // key = '2026-07:1'  →  batch entry
let ACTIVE=null;
let UNIT='half', MODE='total', REPORT_MODE='half';
let charts={};

const qs=s=>document.querySelector(s);
const N=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>(Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const int=n=>Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const T=(zh,en)=>LANG==='en'?en:zh;
function _nowISO(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}

function toast(msg,kind){
  const t=qs('#toast');
  const c={success:'border-emerald-200 text-emerald-700',error:'border-rose-200 text-rose-700',
           warning:'border-amber-200 text-amber-700'}[kind]||'border-slate-100 text-slate-700';
  t.className='fixed bottom-5 right-5 z-[999] max-w-xs bg-white rounded-xl shadow-lg border px-4 py-3 no-print text-sm '+c;
  t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),3200);
}

function toggleLang(){LANG=LANG==='zh'?'en':'zh';applyLang();}
function applyLang(){
  document.querySelectorAll('[data-en]').forEach(el=>{
    if(el.dataset.zhOrig===undefined) el.dataset.zhOrig=el.textContent;
    el.textContent = LANG==='en'?el.dataset.en:el.dataset.zhOrig;
  });
  if(ACTIVE){try{renderAll();}catch(e){console.warn(e);}}
}

// ── 期間鍵：'2026-07:1' = 2026年7月上半月 ──
const bKey=(y,m,b)=>`${y}-${String(m).padStart(2,'0')}:${b}`;
function bLabel(key){
  const [ym,b]=key.split(':'); const [y,m]=ym.split('-');
  const half = b==='1' ? T('上半月','1st half') : T('下半月','2nd half');
  return `${MN[+m-1]} ${y} · ${half}`;
}

// ━━━━━━━━━━━━ INDEXEDDB ━━━━━━━━━━━━
let _db=null,_dbReady=null;
function idbOpen(){
  if(_dbReady)return _dbReady;
  _dbReady=new Promise(res=>{
    const rq=indexedDB.open(IDB_NAME,IDB_VER);
    rq.onupgradeneeded=e=>{const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'key'});};
    rq.onsuccess=e=>{_db=e.target.result;res(_db);};
    rq.onerror=()=>res(null);
  });
  return _dbReady;
}
async function idbSave(entry){
  const db=await idbOpen(); if(!db)return;
  return new Promise(r=>{const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(entry); tx.oncomplete=()=>r(); tx.onerror=()=>r();});
}
async function idbAll(){
  const db=await idbOpen(); if(!db)return [];
  return new Promise(r=>{const rq=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).getAll();
    rq.onsuccess=()=>r(rq.result||[]); rq.onerror=()=>r([]);});
}
async function idbClear(){
  const db=await idbOpen(); if(!db)return;
  return new Promise(r=>{const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).clear(); tx.oncomplete=()=>r(); tx.onerror=()=>r();});
}

// ━━━━━━━━━━━━ 解析：考勤表 ATTENDANCE ━━━━━━━━━━━━
// 版面：R0 標題「202607 01-10Meal fee detail」+ 日期於 col5,7,9…（每日 Present/OT 兩欄）
//       R1 表頭 staff no / Name / Dept. / Group
//       R2+ 資料，col27 = Total（USD）
function parseAttendance(wb){
  for(const sn of wb.SheetNames){
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
    if(!raw.length)continue;
    // 表頭列：含 "staff no"
    let hr=-1, cId=-1,cName=-1,cDept=-1,cGrp=-1;
    for(let i=0;i<8&&hr<0;i++){
      const r=raw[i]||[];
      for(let c=0;c<r.length;c++){
        if(typeof r[c]==='string'&&/staff\s*no/i.test(r[c])){hr=i;cId=c;break;}
      }
    }
    if(hr<0)continue;
    const hdr=raw[hr]||[];
    for(let c=cId+1;c<hdr.length;c++){
      const v=String(hdr[c]||'').trim();
      if(/^name$/i.test(v)&&cName<0)cName=c;
      else if(/^dept/i.test(v)&&cDept<0)cDept=c;
      else if(/^group$/i.test(v)&&cGrp<0)cGrp=c;
    }
    if(cName<0)cName=cId+1;
    if(cDept<0)cDept=cId+2;
    if(cGrp<0)cGrp=cId+3;

    // 標題列（表頭上一列）：年月 + 日期欄
    const tr=raw[Math.max(0,hr-1)]||[];
    let year=0,month=0;
    for(const c of tr){
      if(typeof c==='string'){const m=c.match(/(20\d{2})\s*(\d{2})/);if(m){year=+m[1];month=+m[2];break;}}
    }
    if(!year){ // 退而求其次：任何一列找 yyyymm
      for(let i=0;i<hr;i++) for(const c of (raw[i]||[]))
        if(typeof c==='string'){const m=c.match(/(20\d{2})(\d{2})/);if(m){year=+m[1];month=+m[2];}}
    }
    // 日期欄：標題列中 1–31 的純數字，且其正下方表頭為 Present
    const dayCols=[];
    for(let c=0;c<tr.length;c++){
      const v=tr[c]; if(v==null)continue;
      const t=String(v).trim();
      if(/^\d{1,2}$/.test(t)){
        const d=+t;
        if(d>=1&&d<=31&&/present/i.test(String(hdr[c]||''))) dayCols.push({d,c});
      }
    }
    if(!dayCols.length)continue;
    // Total（USD）欄
    let totCol=-1;
    for(let c=0;c<tr.length;c++)
      if(typeof tr[c]==='string'&&/^total$/i.test(tr[c].trim())){totCol=c;break;}

    const rows=[];
    for(let i=hr+1;i<raw.length;i++){
      const r=raw[i]||[]; const idv=r[cId];
      if(idv==null||String(idv).trim()==='')continue;
      if(!/^\d+$/.test(String(idv).trim()))continue;
      const days=dayCols.map(({d,c})=>({d,present:N(r[c]),ot:N(r[c+1])}));
      // Group 欄粒度較細（35 組，對應餐費表部門），優先作為分析部門；
      // Dept 欄僅 3 個大分類，另存為 division 供對照。
      const grp=String(r[cGrp]||'').trim(), dv=String(r[cDept]||'').trim();
      rows.push({id:String(idv).trim(), name:String(r[cName]||'').trim(),
        dept:(grp||dv||'Other'), division:dv, group:grp,
        days, riel:days.reduce((s,x)=>s+x.present+x.ot,0),
        usd: totCol>=0?N(r[totCol]):0});
    }
    if(!rows.length)continue;
    const ds=dayCols.map(x=>x.d);
    return {kind:'att', year, month, startDay:Math.min(...ds), endDay:Math.max(...ds),
            dayList:ds, rows};
  }
  return null;
}

// ━━━━━━━━━━━━ 解析：餐費表 MEAL FEE ━━━━━━━━━━━━
// 版面：資料表名如「01-15.July.2026」；R3 表頭 No/ID/Name/Dept./Position/Join date + 日期（每日 2 欄）
//       R4 Normal/Overtime/Holiday；R5+ 資料（部門以區段標題分隔）；末欄 Total（USD）
function parseMealFee(wb, fileName){
  // ① 由檔名取得期間提示，例如 Meal_fee__01-15_July__2026.xlsx
  let hintY=0,hintM=0,hintS=0,hintE=0;
  if(fileName){
    const m=String(fileName).match(/(\d{1,2})\s*-\s*(\d{1,2})[_\s.\-]+([A-Za-z]{3,})[_\s.\-]+(20\d{2})/);
    if(m){ hintS=+m[1]; hintE=+m[2]; hintY=+m[4];
      const mi=MN.findIndex(x=>new RegExp('^'+x,'i').test(m[3])); if(mi>=0)hintM=mi+1; }
  }
  // ② 逐一嘗試工作表，取出所有可解析的候選，再挑最符合的
  const cands=[];
  for(const sn of wb.SheetNames){
    const d=parseMealSheet(wb.Sheets[sn],sn);
    if(d) cands.push(d);
  }
  if(!cands.length)return null;
  if(hintY&&hintM){
    const hit=cands.find(d=>d.year===hintY&&d.month===hintM);
    if(hit){ if(hintS)hit.startDay=hintS; if(hintE)hit.endDay=hintE; return hit; }
  }
  // 無提示時取日期最新的一張
  cands.sort((a,b)=>(a.year*100+a.month)-(b.year*100+b.month));
  return cands[cands.length-1];
}

function parseMealSheet(ws,sheetName){
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  if(raw.length<6)return null;
  // 表頭列：含 ID 與 Name
  let hr=-1,cNo=-1,cId=-1,cName=-1,cDept=-1,cPos=-1;
  for(let i=0;i<10&&hr<0;i++){
    const r=raw[i]||[];
    for(let c=0;c<r.length;c++){
      if(typeof r[c]==='string'&&/^id$/i.test(r[c].trim())){
        // 確認同列有 Name
        if(r.some(x=>typeof x==='string'&&/^name$/i.test(x.trim()))){hr=i;cId=c;break;}
      }
    }
  }
  if(hr<0)return null;
  const hdr=raw[hr];
  for(let c=0;c<hdr.length;c++){
    const v=String(hdr[c]||'').trim();
    if(/^no\.?$/i.test(v)&&cNo<0)cNo=c;
    else if(/^name$/i.test(v)&&cName<0)cName=c;
    else if(/^dept/i.test(v)&&cDept<0)cDept=c;
    else if(/^position$/i.test(v)&&cPos<0)cPos=c;
  }
  if(cNo<0)cNo=Math.max(0,cId-1);
  if(cName<0)cName=cId+1;

  // 日期欄
  const dayCols=[];
  let year=0,month=0;
  for(let c=cId+1;c<hdr.length;c++){
    const v=hdr[c]; let dt=null;
    if(v instanceof Date) dt={d:v.getDate(),m:v.getMonth()+1,y:v.getFullYear()};
    else if(typeof v==='number'&&v>40000){
      const p=XLSX.SSF.parse_date_code(v); if(p)dt={d:p.d,m:p.m,y:p.y};
    }
    if(dt){ dayCols.push({d:dt.d,c}); if(!year){year=dt.y;month=dt.m;} }
  }
  if(!dayCols.length)return null;

  // 期間標題（表頭上方兩列或工作表名）
  let startDay=0,endDay=0;
  const scan=[...(raw[Math.max(0,hr-2)]||[]),...(raw[Math.max(0,hr-1)]||[]),sheetName];
  for(const c of scan){
    if(typeof c!=='string')continue;
    const m=c.match(/(\d{1,2})\s*-\s*(\d{1,2})\s*[\/.]\s*([A-Za-z]+)[\/.\s]*(20\d{2})/);
    if(m){ startDay=+m[1]; endDay=+m[2];
      const mi=MN.findIndex(x=>new RegExp('^'+x,'i').test(m[3]));
      if(mi>=0){month=mi+1;year=+m[4];}
      break; }
  }
  const ds0=dayCols.map(x=>x.d);
  if(!startDay){ startDay=Math.min(...ds0); endDay=Math.max(...ds0); }

  // Total（USD）欄：日期欄之後，數值多落在 0–300 的欄
  const lastC=dayCols[dayCols.length-1].c+1;
  let totCol=-1,best=0;
  for(let c=lastC+1;c<lastC+12;c++){
    let hit=0;
    for(let i=hr+1;i<Math.min(raw.length,hr+150);i++){
      const v=(raw[i]||[])[c];
      if(typeof v==='number'&&v>0&&v<300)hit++;
    }
    if(hit>best){best=hit;totCol=c;}
  }

  const rows=[]; let curDept='Other';
  for(let i=hr+1;i<raw.length;i++){
    const r=raw[i]||[]; const no=r[cNo], idv=r[cId];
    if((no==null||String(no).trim()==='')&&typeof idv==='string'&&idv.trim()
        &&!/^total$/i.test(idv.trim())&&!/^\d+$/.test(idv.trim())){
      curDept=idv.trim(); continue;
    }
    if(idv==null||String(idv).trim()==='')continue;
    if(!/^\d+$/.test(String(idv).trim()))continue;
    const dept=(cDept>=0&&String(r[cDept]||'').trim())||curDept||'Other';
    const days=dayCols.map(({d,c})=>({d,present:N(r[c]),ot:N(r[c+1])}));
    rows.push({id:String(idv).trim(), name:String(r[cName]||'').trim(), dept,
      position:cPos>=0?String(r[cPos]||'').trim():'',
      days, riel:days.reduce((s,x)=>s+x.present+x.ot,0),
      usd: totCol>=0?N(r[totCol]):0});
  }
  if(!rows.length)return null;
  return {kind:'meal', year, month, startDay, endDay,
          dayList:ds0, rows, sheet:sheetName};
}

// ━━━━━━━━━━━━ 🪄 智慧匯入 ━━━━━━━━━━━━
function batchOf(startDay){ return startDay<=15 ? 1 : 2; }

async function smartImport(input){
  const files=[...input.files]; input.value='';
  if(!files.length)return;
  const st=qs('#smart-status'), rep=qs('#smart-report');
  st.textContent=T(`⏳ 解析 ${files.length} 個檔案中…`,`⏳ Parsing ${files.length} file(s)…`);
  st.style.color='#c2410c';
  rep.classList.add('hidden'); rep.innerHTML='';

  const log=[], touched=new Set();
  for(const file of files){
    try{
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,raw:true});
      let d=parseAttendance(wb);
      if(!d) d=parseMealFee(wb,file.name);
      if(!d){ log.push({ok:false,f:file.name,msg:T('無法辨識格式（既非考勤表也非餐費表）','Unrecognised format')}); continue; }
      if(!d.year||!d.month){ log.push({ok:false,f:file.name,msg:T('無法辨識年月','Cannot detect year/month')}); continue; }

      const b=batchOf(d.startDay);
      const key=bKey(d.year,d.month,b);
      if(!STORE[key]) STORE[key]={key,year:d.year,month:d.month,batch:b,
                                   meal:null,att:null,updatedAt:_nowISO()};
      const e=STORE[key];

      if(d.kind==='att'){
        // 同一半月可能由多份考勤檔組成（01-10 + 11-15），依日期合併
        if(!e.att) e.att={dayList:[],rows:[],sources:[],startDay:d.startDay,endDay:d.endDay};
        mergeAttendance(e.att,d);
        e.att.sources.push(file.name);
        log.push({ok:true,f:file.name,type:'att',key,n:d.rows.length,
                  span:`${d.startDay}–${d.endDay}`});
      }else{
        e.meal={dayList:d.dayList,rows:d.rows,startDay:d.startDay,endDay:d.endDay,
                source:file.name,sheet:d.sheet};
        log.push({ok:true,f:file.name,type:'meal',key,n:d.rows.length,
                  span:`${d.startDay}–${d.endDay}`});
      }
      e.updatedAt=_nowISO();
      await idbSave(e); touched.add(key);
    }catch(err){ log.push({ok:false,f:file.name,msg:err.message}); }
  }

  const keys=[...touched].sort();
  if(keys.length){ ACTIVE=STORE[keys[keys.length-1]]; }
  showApp(); renderAll();
  if(ACTIVE) pushProjection(ACTIVE);

  const okN=log.filter(l=>l.ok).length;
  st.textContent = okN===log.length
    ? T(`✅ ${okN} 個檔案全部匯入成功`,`✅ All ${okN} file(s) imported`)
    : T(`⚠ ${okN}/${log.length} 個成功，請看下方說明`,`⚠ ${okN}/${log.length} succeeded — see below`);
  st.style.color = okN===log.length ? '#059669':'#b45309';

  // 缺檔備註
  const gaps=[];
  keys.forEach(k=>{
    const e=STORE[k];
    if(!e.meal) gaps.push(`${bLabel(k)} ${T('缺「餐費表」','missing meal-fee file')}`);
    if(!e.att)  gaps.push(`${bLabel(k)} ${T('無考勤表（僅能用餐費表分析）','no attendance file (meal-fee only analysis)')}`);
  });

  rep.innerHTML = log.map(l=>l.ok
    ? `<div class="flex items-start gap-2"><span class="text-emerald-600">✓</span><span class="flex-1"><b>${esc(l.f)}</b> → ${
        l.type==='att'
          ? `<span class="text-sky-700 font-semibold">${T('考勤表','Attendance')}</span>`
          : `<span class="text-orange-700 font-semibold">${T('餐費表','Meal Fee')}</span>`
      } · ${bLabel(l.key)} · ${T('日','days')} ${l.span} · ${l.n} ${T('人','staff')}</span></div>`
    : `<div class="flex items-start gap-2"><span class="text-rose-600">✕</span><span class="flex-1"><b>${esc(l.f)}</b> — ${esc(l.msg)}</span></div>`
  ).join('')
  + (gaps.length
     ? `<div class="mt-1.5 pt-1.5 border-t border-slate-100 text-amber-700">📌 <b>${T('備註','Note')}</b>：${gaps.join('；')}。<span class="text-slate-500">${T('缺檔不影響已匯入的部分，補傳後會自動合併。','Missing files do not affect imported data — upload later to merge.')}</span></div>`
     : `<div class="mt-1.5 pt-1.5 border-t border-slate-100 text-emerald-700">📌 ${T('所選期間的餐費表與考勤表皆已齊全。','Meal-fee and attendance files are both complete.')}</div>`);
  rep.classList.remove('hidden');
  applyLang();
}

// 多份考勤檔合併（依工號 + 日期）
function mergeAttendance(att,d){
  const idx={}; att.rows.forEach(r=>idx[r.id]=r);
  d.rows.forEach(nr=>{
    let r=idx[nr.id];
    if(!r){ r={id:nr.id,name:nr.name,dept:nr.dept,group:nr.group,days:[],riel:0,usd:0};
            att.rows.push(r); idx[nr.id]=r; }
    const dmap={}; r.days.forEach(x=>dmap[x.d]=x);
    nr.days.forEach(x=>{ dmap[x.d] ? (dmap[x.d].present=x.present,dmap[x.d].ot=x.ot) : r.days.push({...x}); });
    r.days.sort((a,b)=>a.d-b.d);
    r.riel=r.days.reduce((s,x)=>s+x.present+x.ot,0);
    r.usd=(r.usd||0)+ (nr.usd||0);
  });
  att.dayList=[...new Set([...att.dayList,...d.dayList])].sort((a,b)=>a-b);
  att.startDay=Math.min(att.startDay??d.startDay,d.startDay);
  att.endDay  =Math.max(att.endDay??d.endDay,d.endDay);
}

// ━━━━━━━━━━━━ 資料存取 ━━━━━━━━━━━━
function sortedKeys(){
  return Object.keys(STORE).sort((a,b)=>{
    const [ay,ab]=a.split(':'), [by,bb]=b.split(':');
    return ay===by ? (+ab)-(+bb) : (ay<by?-1:1);
  });
}
// 目前期間的資料列（優先餐費表，無則用考勤表）
function activeRows(){
  if(!ACTIVE)return {rows:[],src:'none',dayList:[]};
  if(ACTIVE.meal) return {rows:ACTIVE.meal.rows,src:'meal',dayList:ACTIVE.meal.dayList};
  if(ACTIVE.att)  return {rows:ACTIVE.att.rows, src:'att', dayList:ACTIVE.att.dayList};
  return {rows:[],src:'none',dayList:[]};
}
function filtered(){
  const {rows,src,dayList}=activeRows();
  const d=qs('#sel-dept')?qs('#sel-dept').value:'';
  return {rows: d?rows.filter(r=>r.dept===d):rows, src, dayList};
}
// 匯率：由資料反推（riel / usd 的中位數），無法反推則預設 4000
function rateOf(rows){
  const rs=rows.filter(r=>r.usd>0.01&&r.riel>0).map(r=>r.riel/r.usd).sort((a,b)=>a-b);
  if(!rs.length)return 4000;
  return Math.round(rs[Math.floor(rs.length/2)]);
}

// ━━━━━━━━━━━━ 導覽 ━━━━━━━━━━━━
function jumpPeriod(k){ if(!STORE[k])return; ACTIVE=STORE[k]; renderAll(); }
function stepPeriod(dir){
  const ks=sortedKeys(); if(!ks.length)return;
  const i=ACTIVE?ks.indexOf(ACTIVE.key):-1;
  const n=Math.min(ks.length-1,Math.max(0,(i<0?ks.length-1:i)+dir));
  if(n!==i) jumpPeriod(ks[n]);
}

// 本期金額 → 指定時間單位的換算係數
function unitFactor(days){
  const d=days||15;
  switch(UNIT){
    case 'day':   return 1/d;
    case 'week':  return 7/d;
    case 'half':  return 1;
    case 'month': return 2;          // 一個月兩期
    case 'year':  return 24;         // 一年 24 期
    default:      return 1;
  }
}

// 跨期間的「日索引」：把所有已匯入資料攤平成每一天
function dayIndex(){
  const idx={}, pad=n=>String(n).padStart(2,'0');
  const dept=qs('#sel-dept')?qs('#sel-dept').value:'';
  sortedKeys().forEach(k=>{
    const e=STORE[k];
    const rows=e.meal?e.meal.rows:(e.att?e.att.rows:[]);
    const rs=dept?rows.filter(r=>r.dept===dept):rows;
    rs.forEach(r=>r.days.forEach(x=>{
      const key=`${e.year}-${pad(e.month)}-${pad(x.d)}`;
      const b=idx[key]||(idx[key]={y:e.year,m:e.month,d:x.d,riel:0,ot:0,served:0,otServed:0,ids:new Set(),src:e.att?'att':'meal'});
      b.riel+=x.present+x.ot; b.ot+=x.ot;
      if(x.present>0){b.served++; b.ids.add(r.id);}
      if(x.ot>0)b.otServed++;
    }));
  });
  return idx;
}
// ISO 週次
function isoWeek(y,m,d){
  const dt=new Date(y,m-1,d);
  const t=new Date(dt.valueOf());
  t.setDate(t.getDate()+3-((dt.getDay()+6)%7));
  const w1=new Date(t.getFullYear(),0,4);
  return {y:t.getFullYear(),
          w:1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7)};
}
// 依目前時間單位分組
function timeSeries(){
  const idx=dayIndex(), keys=Object.keys(idx).sort();
  const g={}, pad=n=>String(n).padStart(2,'0');
  keys.forEach(k=>{
    const b=idx[k];
    let gk,label;
    if(UNIT==='day'){ gk=k; label=`${b.y}/${pad(b.m)}/${pad(b.d)}`; }
    else if(UNIT==='week'){ const w=isoWeek(b.y,b.m,b.d); gk=`${w.y}-W${pad(w.w)}`; label=gk; }
    else if(UNIT==='half'){ const h=b.d<=15?1:2; gk=`${b.y}-${pad(b.m)}:${h}`;
      label=`${MN[b.m-1]} ${b.y} · ${h===1?T('上半月','1st half'):T('下半月','2nd half')}`; }
    else if(UNIT==='month'){ gk=`${b.y}-${pad(b.m)}`; label=`${MN[b.m-1]} ${b.y}`; }
    else { gk=String(b.y); label=String(b.y); }
    const t=g[gk]||(g[gk]={key:gk,label,days:0,riel:0,ot:0,served:0,otServed:0,ids:new Set(),first:k,last:k});
    t.days++; t.riel+=b.riel; t.ot+=b.ot; t.served+=b.served; t.otServed+=b.otServed;
    b.ids.forEach(id=>t.ids.add(id));
    if(k<t.first)t.first=k; if(k>t.last)t.last=k;
  });
  return Object.values(g).sort((a,b)=>a.first<b.first?1:-1);   // 新 → 舊
}

  let body='';

  G.attOnly.forEach(r=>body+=row(T('僅考勤表有','Attendance only'),'bg-sky-50 text-sky-700',{id:r.id,name:r.name,dept:r.dept,mr:0,ar:r.riel,d:-r.riel}));
  if(!body) body=`<tr><td colspan="7" class="px-3 py-10 text-center text-emerald-600 font-semibold">✅ ${T(`全部 ${G.match.length} 人逐筆相符`,`All ${G.match.length} staff match exactly`)}</td></tr>`;
  else body+=`<tr><td colspan="7" class="px-3 py-3 text-center text-slate-400 text-[11px]">${T(`另有 ${G.match.length} 人完全相符，未列出`,`${G.match.length} matching records hidden`)}</td></tr>`;

  box.innerHTML=`

    <div class="bg-white border border-slate-100 rounded-xl p-4"><p class="text-[11px] text-slate-400">${T('🟠 僅餐費表','🟠 Meal only')}</p><p class="text-2xl font-bold jmono text-orange-600 mt-1">${G.mealOnly.length}</p></div>

  </div>
  <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-100 text-[11px] text-slate-500">
      ${T('核對邏輯：以工號逐人比對「餐費表金額」與「考勤表金額」（皆為瑞爾）。','Per-staff comparison of meal-fee vs attendance amounts (both in Riel).')}
      　${T('餐費表合計','Meal total')} <b>${int(tm)} ៛</b>（$${fmt(tm/rate)}）　
      ${T('考勤表合計','Attendance total')} <b>${int(ta)} ៛</b>（$${fmt(ta/rate)}）

// ── 期間報表 ──
function setReportMode(m){
  REPORT_MODE=m;
  qs('#rp-half').className=_btn(m==='half','orange');
  qs('#rp-month').className=_btn(m==='month','orange');
  qs('#rp-year').className=_btn(m==='year','orange');
  renderReport();
}
function statsOf(e){
  const rows = e.meal?e.meal.rows : (e.att?e.att.rows:[]);
  const dl   = e.meal?e.meal.dayList : (e.att?e.att.dayList:[]);
  const dept = qs('#sel-dept')?qs('#sel-dept').value:'';
  const rs   = dept?rows.filter(r=>r.dept===dept):rows;
  let md=0; rs.forEach(r=>r.days.forEach(d=>{if(d.present>0)md++;}));
  return {n:rs.length, usd:rs.reduce((s,r)=>s+r.usd,0), riel:rs.reduce((s,r)=>s+r.riel,0),
          days:dl.length||15, mdays:md, hasMeal:!!e.meal, hasAtt:!!e.att};
}
function renderReport(){
  const ks=sortedKeys().reverse();
  const perCap=(MODE==='cap');
  const th=qs('#rp-thead'), tb=qs('#rp-tbody');

  if(REPORT_MODE==='half'){
    qs('#rp-count').textContent=`${ks.length} ${T('期','periods')}`;
    th.innerHTML=[T('期間','Period'),T('天數','Days'),T('人數','Staff'),T('每日 USD','Daily USD'),
      T('本期 USD','Period USD'),T('人均 USD','Per capita'),T('用餐人日','Meal-days'),T('檔案','Files')]
      .map((h,i)=>`<th class="px-3 py-2 ${i?'text-right':'text-left'} font-semibold whitespace-nowrap">${h}</th>`).join('');
    tb.innerHTML=ks.map(k=>{
      const e=STORE[k], s=statsOf(e), act=ACTIVE&&ACTIVE.key===k;
      const base=perCap?s.usd/(s.n||1):s.usd;
      const files=(s.hasMeal?`<span class="text-orange-600">${T('餐','M')}</span>`:`<span class="text-slate-300">${T('餐','M')}</span>`)
                +' / '+(s.hasAtt?`<span class="text-sky-600">${T('勤','A')}</span>`:`<span class="text-slate-300">${T('勤','A')}</span>`);
      return `<tr onclick="jumpPeriod('${k}')" class="border-b border-slate-50 cursor-pointer ${act?'bg-orange-50/60':'hover:bg-slate-50'}">
        <td class="px-3 py-2 font-semibold ${act?'text-orange-700':'text-slate-700'}">${bLabel(k)}${act?' ◀':''}</td>
        <td class="px-3 py-2 text-right jmono">${s.days}</td>
        <td class="px-3 py-2 text-right jmono">${s.n}</td>
        <td class="px-3 py-2 text-right jmono">$${fmt(base/s.days)}</td>
        <td class="px-3 py-2 text-right jmono font-semibold text-orange-700">$${fmt(base)}</td>
        <td class="px-3 py-2 text-right jmono">$${fmt(s.usd/(s.n||1))}</td>
        <td class="px-3 py-2 text-right jmono">${int(s.mdays)}</td>
        <td class="px-3 py-2 text-right text-[11px]">${files}</td></tr>`;
    }).join('')||`<tr><td colspan="8" class="px-3 py-8 text-center text-slate-400">${T('無資料','No data')}</td></tr>`;
    return;
  }

  // 月報 / 年報：彙總
  const agg={};
  ks.forEach(k=>{
    const g = REPORT_MODE==='month' ? k.split(':')[0] : k.slice(0,4);
    const s = statsOf(STORE[k]);
    if(!agg[g]) agg[g]={periods:0,n:0,usd:0,riel:0,mdays:0,days:0};
    agg[g].periods++; agg[g].n+=s.n; agg[g].usd+=s.usd;
    agg[g].riel+=s.riel; agg[g].mdays+=s.mdays; agg[g].days+=s.days;
  });
  const gs=Object.keys(agg).sort().reverse();
  qs('#rp-count').textContent=`${gs.length} ${REPORT_MODE==='month'?T('個月','months'):T('個年度','years')}`;
  th.innerHTML=[REPORT_MODE==='month'?T('月份','Month'):T('年度','Year'),
    T('期數','Periods'),T('天數','Days'),T('平均人數','Avg staff'),
    T('每日 USD','Daily USD'),T('合計 USD','Total USD'),T('人均 USD','Per capita'),T('用餐人日','Meal-days')]
    .map((h,i)=>`<th class="px-3 py-2 ${i?'text-right':'text-left'} font-semibold whitespace-nowrap">${h}</th>`).join('');
  tb.innerHTML=gs.map(g=>{
    const v=agg[g], avgN=v.n/v.periods;
    const label = REPORT_MODE==='month'
      ? `${MN[+g.split('-')[1]-1]} ${g.split('-')[0]}` : g;
    const base = perCap ? v.usd/(avgN||1) : v.usd;
    return `<tr class="border-b border-slate-50 hover:bg-slate-50">
      <td class="px-3 py-2 font-semibold text-slate-700">${label}</td>
      <td class="px-3 py-2 text-right jmono">${v.periods}</td>
      <td class="px-3 py-2 text-right jmono">${v.days}</td>
      <td class="px-3 py-2 text-right jmono">${Math.round(avgN)}</td>
      <td class="px-3 py-2 text-right jmono">$${fmt(base/(v.days||1))}</td>
      <td class="px-3 py-2 text-right jmono font-bold text-orange-700">$${fmt(base)}</td>
      <td class="px-3 py-2 text-right jmono">$${fmt(v.usd/(avgN||1))}</td>
      <td class="px-3 py-2 text-right jmono">${int(v.mdays)}</td></tr>`;
  }).join('')||`<tr><td colspan="8" class="px-3 py-8 text-center text-slate-400">${T('無資料','No data')}</td></tr>`;
}

// ━━━━━━━━━━━━ TELEGRAM ━━━━━━━━━━━━
function buildTgText(key){
  const e=STORE[key]; if(!e)return{err:T('查無此期間','Period not found')};
  const rows = e.meal?e.meal.rows : (e.att?e.att.rows:[]);
  if(!rows.length)return{err:T('此期間無資料','No data for this period')};
  const rate=rateOf(rows);
  const dl=(e.meal?e.meal.dayList:e.att.dayList)||[];
  const dm={};
  rows.forEach(r=>{ (dm[r.dept]=dm[r.dept]||{n:0,usd:0,riel:0}); dm[r.dept].n++;
                    dm[r.dept].usd+=r.usd; dm[r.dept].riel+=r.riel; });
  const list=Object.entries(dm).sort((a,b)=>b[1].usd-a[1].usd);
  const tUsd=list.reduce((s,[,v])=>s+v.usd,0), tRiel=list.reduce((s,[,v])=>s+v.riel,0);
  let md=0; rows.forEach(r=>r.days.forEach(d=>{if(d.present>0)md++;}));

  let t=`🍱 <b>餐費發放 Meal Fee</b>\n`
   +`📅 期間 Period：${esc(bLabel(key))}（${e.month}/${Math.min(...dl)}–${e.month}/${Math.max(...dl)}）\n`
   +`👥 總人數 Headcount：${rows.length}　🏭 部門 Depts：${list.length}\n`
   +`🍚 用餐人日 Meal-days：${int(md)}\n`
   +`💵 <b>發放總額 Total：$${fmt(tUsd)}</b>（${int(tRiel)} ៛ @ ${int(rate)}）\n`
   +`— — — — — — — — — —\n`
   +`<b>各部門明細 By Department</b>\n<i>部門 Dept ｜ 人數 Staff ｜ 金額 Amount</i>\n`;
  list.forEach(([d,v])=>{ t+=`${esc(d)}：${v.n} 人 · $${fmt(v.usd)}\n`; });
  t+=`— — — — — — — — — —\n合計 TOTAL：${rows.length} 人 Staff　<b>$${fmt(tUsd)}</b>`;
  if(!e.meal) t+=`\n\n⚠️ ${T('註：本期僅有考勤表，金額為考勤推算值','Note: attendance-only estimate')}`;
  return {text:t};
}
function openTgModal(){
  const ks=sortedKeys().reverse();
  if(!ks.length){toast(T('尚無資料','No data yet'),'error');return;}
  const sel=qs('#tg-period');
  sel.innerHTML=ks.map(k=>{

  }).join('');

function closeTgModal(){const m=qs('#tg-modal');m.classList.add('hidden');m.classList.remove('flex');}
function previewTg(){
  const r=buildTgText(qs('#tg-period').value);
  const pv=qs('#tg-preview'), btn=qs('#tg-send');
  if(r.err){ pv.textContent='⚠️ '+r.err; btn.disabled=true;
    btn.className='flex-1 text-xs font-bold px-3 py-2.5 rounded-lg bg-slate-200 text-slate-400 cursor-not-allowed'; }
  else { pv.textContent=r.text.replace(/<\/?b>/g,'').replace(/<\/?i>/g,''); btn.disabled=false;
    btn.className='flex-1 text-xs font-bold px-3 py-2.5 rounded-lg bg-orange-600 text-white hover:bg-orange-700 transition'; }
}
async function confirmSendTg(){
  const r=buildTgText(qs('#tg-period').value);
  if(r.err){toast(r.err,'error');return;}
  const btn=qs('#tg-send'); btn.disabled=true; btn.textContent=T('傳送中…','Sending…');
  const ok=await sendTG(r.text);
  btn.disabled=false; btn.textContent=T('確認傳送','Send');
  if(ok) closeTgModal();
}
async function sendTG(text){
  if(!GAS_URL){toast(T('尚未設定 GAS URL','GAS URL not set'),'error');return false;}
  if(!text||!text.trim()){toast(T('訊息內容是空的，未送出','Message empty — not sent'),'error');return false;}
  try{
    const r=await fetch(GAS_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type:'notify',text})});
    let d=null; try{d=await r.json();}catch(e){}
    if(d&&d.sent===false){toast(T('GAS 回報未送出，請確認 Bot 在群組內','GAS reported not sent'),'error');return false;}
    toast(T('已傳送至 Telegram 群組','Sent to Telegram group'),'success');return true;
  }catch(e){toast(T('傳送失敗：','Send failed: ')+e.message,'error');return false;}
}

// ━━━━━━━━━━━━ PROJECTION / 雲端 ━━━━━━━━━━━━
function projectionOf(e){
  const rows=e.meal?e.meal.rows:(e.att?e.att.rows:[]);
  const period=`${e.year}-${String(e.month).padStart(2,'0')}`;
  return {
    module:'meal', period, mealBatch:e.batch, payPhase:'',
    updatedAt:e.updatedAt||_nowISO(),
    sourceFile:(e.meal&&e.meal.source)||((e.att&&e.att.sources)||[]).join(', ')||'',
    rows: rows.map(r=>({employeeId:r.id,name:r.name,dept:r.dept,period,
      mealBatch:e.batch, mealFee:Math.round(r.usd*100)/100,
      mealRiel:r.riel, mealDays:r.days.filter(d=>d.present>0).length})),
    totals:{mealFee:Math.round(rows.reduce((s,r)=>s+r.usd,0)*100)/100,
            mealRiel:rows.reduce((s,r)=>s+r.riel,0), headcount:rows.length}
  };
}
async function pushProjection(e){
  try{
    const p=projectionOf(e);
    // 本機：合併所有期間為 batches 陣列
    const all=sortedKeys().map(k=>projectionOf(STORE[k]));
    localStorage.setItem('hrpay:result:meal',JSON.stringify({
      module:'meal', updatedAt:_nowISO(),
      batches: all.map(x=>({period:x.period,mealBatch:x.mealBatch,rows:x.rows,
                            totals:x.totals,updatedAt:x.updatedAt,sourceFile:x.sourceFile}))
    }));
    if(GAS_URL) await fetch(GAS_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type:'projection',...p})});
  }catch(err){console.warn('projection',err);}
}
async function cloudUpload(){
  if(!ACTIVE){toast(T('尚無資料可上傳','Nothing to upload'),'error');return;}
  const b=qs('#btn-cloud-up'); b.disabled=true; b.classList.add('opacity-50');
  try{
    await pushProjection(ACTIVE);
    await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({tool:'hrpay_meal',updatedAt:_nowISO(),
        batches:sortedKeys().map(k=>STORE[k])})});
    toast(T('☁ 已上傳雲端','☁ Uploaded'),'success');
  }catch(e){toast(T('上傳失敗：','Upload failed: ')+e.message,'error');}
  b.disabled=false; b.classList.remove('opacity-50');
}
async function cloudDownload(){
  const b=qs('#btn-cloud-down'); b.disabled=true; b.classList.add('opacity-50');
  try{
    const r=await fetch(GAS_URL+'?action=pull&tool=hrpay_meal');
    const d=await r.json();
    const arr=(d&&d.data&&d.data.batches)||[];
    if(!arr.length) toast(T('雲端尚無資料','No cloud data'),'warning');
    else{
      for(const e of arr){ STORE[e.key]=e; await idbSave(e); }
      ACTIVE=STORE[sortedKeys().slice(-1)[0]];
      renderAll();
      toast(T(`☁ 已載入 ${arr.length} 期資料`,`☁ Loaded ${arr.length} period(s)`),'success');
    }
  }catch(e){toast(T('下載失敗：','Download failed: ')+e.message,'error');}
  b.disabled=false; b.classList.remove('opacity-50');
}

// ━━━━━━━━━━━━ 其他 ━━━━━━━━━━━━
function exportCSV(which){
  const tbl = which==='dept' ? qs('#pane-dept table') : qs('#pane-roster table');
  const rows=[...tbl.querySelectorAll('tr')].map(tr=>
    [...tr.children].map(td=>`"${td.textContent.trim().replace(/"/g,'""')}"`).join(','));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`meal_${which}_${ACTIVE?ACTIVE.key.replace(':','_B'):'data'}.csv`; a.click();
  toast(T('CSV 已下載','CSV downloaded'),'success');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(STORE,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`meal_fee_backup_${_nowISO().slice(0,10)}.json`; a.click();
}
async function clearAllData(){
  if(!confirm(T('確定清除所有已匯入的餐費與考勤資料？','Clear all imported meal-fee and attendance data?')))return;
  STORE={}; ACTIVE=null; await idbClear();
  localStorage.removeItem('hrpay:result:meal');
  qs('#smart-report').classList.add('hidden'); qs('#smart-status').textContent='';
  showApp();
  toast(T('資料已清除','Data cleared'),'warning');
}

// ━━━━━━━━━━━━ 啟動 ━━━━━━━━━━━━
(async function init(){
  const all=await idbAll();
  all.forEach(e=>{STORE[e.key]=e;});
  if(all.length){ ACTIVE=STORE[sortedKeys().slice(-1)[0]]; }
  showApp();
  if(ACTIVE) renderAll();
  applyLang();
})();

// ━━━━━━━━━ 拖放上傳 Drag & Drop ━━━━━━━━━
//  <label> 內的 file input 不會自動接收拖放，需自行掛載事件。
//  同時攔截整個視窗的拖放，避免瀏覽器直接開啟檔案。
function setupDropZone(sel, handler, ringCls){
  const el=document.querySelector(sel); if(!el)return;
  const stop=e=>{e.preventDefault();e.stopPropagation();};
  ['dragenter','dragover','dragleave','drop'].forEach(ev=>el.addEventListener(ev,stop,false));
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,()=>{
    el.classList.add('ring-2','ring-offset-2',ringCls);}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,()=>{
    el.classList.remove('ring-2','ring-offset-2',ringCls);}));
  el.addEventListener('drop',e=>{
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])]
      .filter(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name));
    if(files.length) handler({files, value:''});
    else toast(T('請拖入 Excel 或 CSV 檔','Please drop an Excel or CSV file'),'warning');
  },false);
  // 視窗層級：拖到非放置區時不要讓瀏覽器開檔
  ['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{
    if(!el.contains(e.target)) e.preventDefault();},false));
}

setupDropZone('#dz-smart', smartImport, 'ring-orange-400');
</script>
