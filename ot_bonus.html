<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏱ OT &amp; Bonus Analytics | AC-HRA-PAY</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC','Segoe UI',sans-serif;background:#f6f8fb;}
  .jmono{font-family:'IBM Plex Mono',monospace;}
  .tab-active{border-bottom:2.5px solid #0d9488;color:#0f766e;font-weight:700;}
  .tab-inactive{border-bottom:2.5px solid transparent;color:#64748b;}
  .ch260{height:260px;} .ch300{height:300px;}
  .anim{animation:fade .35s ease both;} .anim-1{animation-delay:.05s;} .anim-2{animation-delay:.1s;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  ::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  @media print{.no-print{display:none!important}}
</style>
</head>
<body class="text-slate-800">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
  <div class="max-w-screen-2xl mx-auto px-4 py-2.5 flex flex-wrap items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-teal-600 to-emerald-700 flex items-center justify-center text-white font-bold text-lg shrink-0">⏱</div>
    <div class="mr-2">
      <h1 class="text-base font-bold leading-tight">OT &amp; Bonus Analytics</h1>
      <p class="text-[10px] text-slate-400 mt-0.5">Vantage River Textiles · Phnom Penh
        <span class="ml-1 px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600 font-mono border border-emerald-100">v2.2</span></p>
    </div>
    <div class="flex items-center gap-1.5 ml-auto flex-wrap">
      <div class="no-print flex items-center rounded-md border border-sky-200 bg-sky-50 overflow-hidden">
        <button id="btn-cloud-up" onclick="cloudUpload()" title="上傳至雲端"
          class="flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 text-sky-700 hover:bg-sky-100 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6H16a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          <span class="hidden md:inline" data-en="Upload">上傳</span></button>
        <span class="w-px h-4 bg-sky-200"></span>
        <button id="btn-cloud-down" onclick="cloudDownload()" title="從雲端下載"
          class="flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 text-sky-700 hover:bg-sky-100 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6H16a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/></svg>
          <span class="hidden md:inline" data-en="Download">下載</span></button>
      </div>
      <button onclick="openTgModal()" class="no-print flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded-md border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">
        ✈️ <span data-en="Telegram">傳送</span></button>
      <button onclick="clearAllData()" class="no-print flex items-center gap-1 text-xs font-medium px-2.5 py-1.5 rounded-md border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 transition">
        🗑 <span class="hidden sm:inline" data-en="Clear All">清除全部</span></button>
      <button onclick="exportJSON()" class="no-print text-xs font-medium px-2.5 py-1.5 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50 transition">
        ⬇ <span class="hidden sm:inline" data-en="Export">匯出</span></button>
      <button onclick="toggleLang()" class="no-print text-xs font-semibold px-3 py-1.5 rounded-md bg-teal-50 text-teal-700 border border-teal-200 hover:bg-teal-100 transition">中/EN</button>
    </div>
  </div>
</header>

<!-- SMART IMPORT -->
<div class="bg-gradient-to-r from-teal-50 via-white to-sky-50 border-b border-slate-100 no-print">
  <div class="max-w-screen-2xl mx-auto px-4 py-3">
    <label id="dz-smart-ob" class="flex flex-wrap items-center gap-3 border-2 border-dashed border-teal-300 rounded-xl px-4 py-3 cursor-pointer hover:border-teal-500 hover:bg-teal-50/60 transition group">
      <div class="w-10 h-10 rounded-lg bg-teal-100 flex items-center justify-center shrink-0 group-hover:bg-teal-200 transition"><span class="text-xl">🪄</span></div>
      <div class="flex-1 min-w-[220px]">
        <p class="text-sm font-bold text-teal-800" data-en="Smart Import — just drop any files here">智慧匯入 — 檔案直接丟進來就好</p>
        <p class="text-[11px] text-slate-500 mt-0.5" data-en="Overtime and Bonus workbooks, any number at once. Type and years are detected automatically.">
          加班表、獎金表都可以，一次選多個檔。系統自動辨識類型與年度，不必分開上傳。</p>
        <p id="smart-status" class="text-[11px] mt-1 font-medium"></p>
      </div>
      <span class="text-xs font-semibold px-3 py-2 rounded-lg bg-teal-600 text-white shrink-0 group-hover:bg-teal-700 transition" data-en="Choose files">選擇檔案</span>
      <input type="file" accept=".xlsx,.xls,.xlsm,.csv" multiple class="hidden" onchange="smartImport(this)">
    </label>
    <div id="smart-report" class="hidden mt-2 text-[11px] bg-white border border-slate-200 rounded-lg p-2.5 space-y-1"></div>
  </div>
</div>

<!-- TABS -->
<div class="bg-white border-b border-slate-200 sticky top-[57px] z-30 no-print">
  <div class="max-w-screen-2xl mx-auto px-4 flex gap-1 overflow-x-auto">
    <button id="tab-dash"   onclick="goTab('dash')"   class="tab-active text-sm px-4 py-3 whitespace-nowrap transition" data-en="📊 Dashboard">📊 儀表板</button>
    <button id="tab-time"   onclick="goTab('time')"   class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="📅 Time Detail">📅 時間明細</button>
    <button id="tab-dept"   onclick="goTab('dept')"   class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="🏭 By Department">🏭 部門分析</button>
    <button id="tab-cmp"    onclick="goTab('cmp')"    class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="⚖️ OT vs Bonus">⚖️ 加班 vs 獎金</button>
    <button id="tab-report" onclick="goTab('report')" class="tab-inactive text-sm px-4 py-3 whitespace-nowrap transition" data-en="📋 Period Report">📋 期間報表</button>
  </div>
</div>

<main class="max-w-screen-2xl mx-auto px-4 py-4">

<div id="empty-state" class="flex flex-col items-center justify-center py-28 text-center">
  <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mb-4"><span class="text-3xl">⏱</span></div>
  <p class="text-slate-400 font-medium" data-en="Upload Overtime or Bonus workbooks to begin">上傳加班表或獎金表後開始分析</p>
  <p class="text-slate-300 text-xs mt-2" data-en="Both file types are auto-detected — no need to sort them yourself.">兩種檔案都會自動辨識，不用自己分類</p>
</div>

<div id="app" class="hidden">

  <!-- 操作台 -->
  <div class="mb-4 bg-white border border-slate-200 rounded-xl p-3 space-y-2.5">
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="stepPeriod(-1)" title="上一期"
        class="w-9 h-9 rounded-lg border border-slate-200 hover:bg-slate-50 hover:border-teal-400 transition flex items-center justify-center text-slate-500 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg></button>
      <select id="nav-period" onchange="jumpPeriod(this.value)"
        class="text-sm font-bold border border-slate-200 rounded-lg px-4 py-2 bg-white outline-none focus:ring-2 focus:ring-teal-200 min-w-[170px] text-center"></select>
      <button onclick="stepPeriod(1)" title="下一期"
        class="w-9 h-9 rounded-lg border border-slate-200 hover:bg-slate-50 hover:border-teal-400 transition flex items-center justify-center text-slate-500 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg></button>
      <span id="nav-hint" class="text-[11px] ml-1"></span>
      <select id="sel-dept" onchange="renderAll()"
        class="ml-auto text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white outline-none focus:ring-2 focus:ring-teal-200 min-w-[180px]">
        <option value="" data-en="All Departments">全廠 All Departments</option>
      </select>
    </div>
    <div class="flex flex-wrap items-center gap-2.5">
      <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider w-14" data-en="Type">類型</span>
      <div class="flex bg-slate-100 rounded-lg p-0.5">
        <button id="ct-ot"    onclick="setType('ot')"    data-en="⏱ Overtime" class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-teal-700 transition">⏱ 加班</button>
        <button id="ct-bonus" onclick="setType('bonus')" data-en="🎁 Bonus"    class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">🎁 獎金</button>
        <button id="ct-both"  onclick="setType('both')"  data-en="Σ Combined"  class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">Σ 合計</button>
      </div>
      <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider ml-2" data-en="Time">時間</span>
      <div class="flex bg-slate-100 rounded-lg p-0.5">
        <button id="cu-day"     onclick="setUnit('day')"     data-en="Daily"     class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每日</button>
        <button id="cu-week"    onclick="setUnit('week')"    data-en="Weekly"    class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每週</button>
        <button id="cu-month"   onclick="setUnit('month')"   data-en="Monthly"   class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-teal-700 transition">每月</button>
        <button id="cu-quarter" onclick="setUnit('quarter')" data-en="Quarterly" class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每季</button>
        <button id="cu-year"    onclick="setUnit('year')"    data-en="Yearly"    class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">每年</button>
      </div>
      <div class="flex bg-slate-100 rounded-lg p-0.5">
        <button id="cm-total" onclick="setMode('total')" data-en="Total"      class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-sky-700 transition">總額</button>
        <button id="cm-cap"   onclick="setMode('cap')"   data-en="Per Capita" class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">人均</button>
      </div>
      <span id="scope-txt" class="text-[11px] text-slate-400 ml-auto"></span>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="pane-dash" class="pane">
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p class="text-[11px] text-slate-400 font-medium" data-en="EXPENSE">支出金額 EXPENSE</p>
        <p id="k-exp" class="text-2xl font-bold jmono mt-1 text-teal-600">—</p>
        <p id="k-exp-s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p class="text-[11px] text-slate-400 font-medium" data-en="HEADCOUNT">人次 HEADCOUNT</p>
        <p id="k-ppl" class="text-2xl font-bold jmono mt-1">—</p>
        <p id="k-ppl-s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p class="text-[11px] text-slate-400 font-medium" data-en="OT HOURS">加班時數 HOURS</p>
        <p id="k-hr" class="text-2xl font-bold jmono mt-1 text-sky-600">—</p>
        <p id="k-hr-s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p class="text-[11px] text-slate-400 font-medium" data-en="COST PER HOUR">每小時成本 $/HR</p>
        <p id="k-rate" class="text-2xl font-bold jmono mt-1 text-amber-600">—</p>
        <p id="k-rate-s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-2">
        <p class="text-[11px] text-slate-400 font-medium" data-en="PER PERSON">人均支出 PER PERSON</p>
        <p id="k-avg" class="text-2xl font-bold jmono mt-1 text-emerald-600">—</p>
        <p id="k-avg-s" class="text-[11px] text-slate-400 mt-0.5"></p></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim">
        <p class="text-sm font-semibold text-slate-700 mb-1" data-en="Trend">趨勢走勢</p>
        <p id="trend-note" class="text-[11px] text-slate-400 mb-3"></p>
        <div class="ch300"><canvas id="trend-chart"></canvas></div>
      </div>
      <div class="bg-white border border-slate-100 shadow-sm rounded-xl p-4 anim anim-1">
        <p class="text-sm font-semibold text-slate-700 mb-1" data-en="By Department">各部門支出</p>
        <p class="text-[11px] text-slate-400 mb-3" data-en="Top 15">前 15 名</p>
        <div class="ch300"><canvas id="dept-chart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- TIME DETAIL -->
  <div id="pane-time" class="pane hidden">
    <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <p id="time-title" class="text-sm font-semibold text-slate-700 flex-1">📅 每月明細</p>
        <span id="time-src" class="text-[11px] px-2 py-0.5 rounded-full"></span>
        <button onclick="exportCSV('time')" class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition">⬇ CSV</button>
      </div>
      <div id="time-note" class="px-4 py-2 text-[11px] text-slate-500 bg-slate-50 border-b border-slate-100"></div>
      <div class="overflow-x-auto"><table class="w-full text-xs">
        <thead class="bg-slate-50 text-slate-500"><tr id="time-thead"></tr></thead>
        <tbody id="time-tbody"></tbody>
        <tfoot class="bg-slate-50 font-bold text-slate-700 border-t-2 border-slate-200"><tr id="time-tfoot"></tr></tfoot>
      </table></div>
    </div>
  </div>

  <!-- DEPT -->
  <div id="pane-dept" class="pane hidden">
    <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <p class="text-sm font-semibold text-slate-700 flex-1" data-en="🏭 Department Breakdown">🏭 各部門明細</p>
        <button onclick="exportCSV('dept')" class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition">⬇ CSV</button>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-xs">
        <thead class="bg-slate-50 text-slate-500"><tr id="dept-thead"></tr></thead>
        <tbody id="dept-tbody"></tbody>
        <tfoot class="bg-slate-50 font-bold text-slate-700 border-t-2 border-slate-200"><tr id="dept-tfoot"></tr></tfoot>
      </table></div>
    </div>
  </div>

  <!-- COMPARE -->
  <div id="pane-cmp" class="pane hidden"><div id="cmp-body"></div></div>

  <!-- REPORT -->
  <div id="pane-report" class="pane hidden">
    <div class="bg-white border border-slate-100 shadow-sm rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <p class="text-sm font-semibold text-slate-700 flex-1" data-en="📋 Period Report">📋 期間報表</p>
        <div class="flex bg-slate-100 rounded-lg p-0.5">
          <button id="rp-month"   onclick="setReportMode('month')"   data-en="Monthly"   class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-teal-700 transition">月報</button>
          <button id="rp-quarter" onclick="setReportMode('quarter')" data-en="Quarterly" class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">季報</button>
          <button id="rp-year"    onclick="setReportMode('year')"    data-en="Yearly"    class="text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition">年報</button>
        </div>
        <span id="rp-count" class="text-[11px] text-slate-400"></span>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-xs">
        <thead class="bg-slate-50 text-slate-500"><tr id="rp-thead"></tr></thead>
        <tbody id="rp-tbody"></tbody>
      </table></div>
    </div>
  </div>

</div>
</main>

<!-- TELEGRAM MODAL -->
<div id="tg-modal" class="fixed inset-0 z-[1000] hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm no-print p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-2">
      <span class="text-xl">✈️</span>
      <div class="flex-1">
        <p class="text-sm font-bold text-slate-800" data-en="Send to Telegram Group">傳送至 Telegram 群組</p>
        <p class="text-[11px] text-slate-400 mt-0.5" data-en="OT / Bonus Summary">加班 / 獎金摘要</p>
      </div>
      <button onclick="closeTgModal()" class="text-slate-300 hover:text-slate-500 text-xl leading-none">&times;</button>
    </div>
    <div class="px-5 py-4 space-y-3">
      <div>
        <label class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider" data-en="Report Type">報表類型 Type</label>
        <select id="tg-type" onchange="previewTg()" class="mt-1.5 w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white outline-none focus:ring-2 focus:ring-teal-200">
          <option value="ot" data-en="⏱ Overtime">⏱ 加班 Overtime</option>
          <option value="bonus" data-en="🎁 Bonus">🎁 獎金 Bonus</option>
          <option value="both" data-en="Σ Combined">Σ 合計 Combined</option>
        </select>
      </div>
      <div>
        <label class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider" data-en="Select Period">選擇期間 Period</label>
        <select id="tg-period" onchange="previewTg()" class="mt-1.5 w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white outline-none focus:ring-2 focus:ring-teal-200"></select>
      </div>
      <div>
        <label class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider" data-en="Message Preview">訊息預覽 Preview</label>
        <pre id="tg-preview" class="mt-1.5 text-[11px] leading-relaxed bg-slate-50 border border-slate-100 rounded-lg p-3 max-h-56 overflow-auto whitespace-pre-wrap text-slate-600"></pre>
      </div>
    </div>
    <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex gap-2">
      <button onclick="closeTgModal()" data-en="Cancel" class="flex-1 text-xs font-medium px-3 py-2.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition">取消</button>
      <button id="tg-send" onclick="confirmSendTg()" data-en="Send" class="flex-1 text-xs font-bold px-3 py-2.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700 transition">確認傳送</button>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-5 right-5 z-[999] max-w-xs bg-white rounded-xl shadow-lg border border-slate-100 px-4 py-3 hidden no-print text-sm"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════
//  AC-HRA-PAY · OT & Bonus Analytics v2.0
//  資料粒度：部門 × 月（PPl / Hour / Expense），非員工級
// ═══════════════════════════════════════════════════════
const GAS_URL = localStorage.getItem('hrpay_gas_url') ||
  'https://script.google.com/macros/s/AKfycbwmmRduvOe5RdnR_iALwEIi_6lQaTq4SXH88jmoIjiHwTsTrW5qnlPTr8PSmOT7C2rdGg/exec';
const IDB_NAME='ac_hra_otbonus', IDB_VER=1, IDB_STORE='records';
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PALETTE=['#0d9488','#0ea5e9','#f59e0b','#8b5cf6','#f43f5e','#84cc16','#14b8a6','#6366f1','#ec4899','#eab308'];
const WORK_DAYS=26, WEEKS=4.33;

let LANG='zh';
let RECS=[];            // {type:'ot'|'bonus', year, month, dept, ppl, hour, expense, src}
let ACTIVE=null;        // 'YYYY-MM'
let TYPE='ot', UNIT='month', MODE='total', REPORT_MODE='month';
let charts={};

const qs=s=>document.querySelector(s);
const N=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>(Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const int=n=>Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const T=(zh,en)=>LANG==='en'?en:zh;
const pad=n=>String(n).padStart(2,'0');
function _nowISO(){const d=new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}

function toast(msg,kind){
  const t=qs('#toast');
  const c={success:'border-emerald-200 text-emerald-700',error:'border-rose-200 text-rose-700',
           warning:'border-amber-200 text-amber-700'}[kind]||'border-slate-100 text-slate-700';
  t.className='fixed bottom-5 right-5 z-[999] max-w-xs bg-white rounded-xl shadow-lg border px-4 py-3 no-print text-sm '+c;
  t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),3200);
}
function toggleLang(){LANG=LANG==='zh'?'en':'zh';applyLang();}
function applyLang(){
  document.querySelectorAll('[data-en]').forEach(el=>{
    if(el.dataset.zhOrig===undefined) el.dataset.zhOrig=el.textContent;
    el.textContent=LANG==='en'?el.dataset.en:el.dataset.zhOrig;
  });
  if(RECS.length){try{renderAll();}catch(e){console.warn(e);}}
}

// ━━━━━━━━━ IndexedDB ━━━━━━━━━
let _dbReady=null;
function idbOpen(){
  if(_dbReady)return _dbReady;
  _dbReady=new Promise(res=>{
    const rq=indexedDB.open(IDB_NAME,IDB_VER);
    rq.onupgradeneeded=e=>{const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'k'});};
    rq.onsuccess=e=>res(e.target.result); rq.onerror=()=>res(null);
  });
  return _dbReady;
}
async function idbSaveAll(){
  const db=await idbOpen(); if(!db)return;
  return new Promise(r=>{const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({k:'all',recs:RECS,updatedAt:_nowISO()});
    tx.oncomplete=()=>r(); tx.onerror=()=>r();});
}
async function idbLoad(){
  const db=await idbOpen(); if(!db)return [];
  return new Promise(r=>{const rq=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get('all');
    rq.onsuccess=()=>r((rq.result&&rq.result.recs)||[]); rq.onerror=()=>r([]);});
}
async function idbClear(){
  const db=await idbOpen(); if(!db)return;
  return new Promise(r=>{const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).clear(); tx.oncomplete=()=>r(); tx.onerror=()=>r();});
}

// ━━━━━━━━━ 解析：加班／獎金試算表 ━━━━━━━━━
//  版面：每年一張工作表（表名為 4 位數年份）
//        某列含 PPl / Hour / Expense（或 PPl / Expense）→ 表頭列
//        表頭列上方為月份名稱，橫向每月一組欄位
//        表頭列下方為部門列，部門名稱位於「PPl 左側第一欄」
function parseOtBonusSheet(ws, sheetName){
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  if(raw.length<4)return null;

  // 表頭列：找出含多個 PPl 的列
  let hr=-1;
  for(let i=0;i<10;i++){
    const r=raw[i]||[];
    const n=r.filter(c=>typeof c==='string'&&/^\s*ppl\s*$/i.test(c)).length;
    if(n>=2){hr=i;break;}
  }
  if(hr<0)return null;
  const hdr=raw[hr];

  // 月份標題列（表頭列上方最近一列含月份名稱者）
  const monthRow=(()=>{
    for(let i=hr-1;i>=0;i--){
      const r=raw[i]||[];
      if(r.some(c=>typeof c==='string'&&MN.some(m=>new RegExp('^'+m.slice(0,3),'i').test(c.trim()))))return {row:r,idx:i};
    }
    return {row:[],idx:-1};
  })();
  const mrow=monthRow.row;

  // ⚠ 由「月份標題」反推欄組，而非掃描所有 PPl。
  //    工作表右側常有 TTL / Month 年度彙總區，其中也有 PPl/Hour/Expense，
  //    若一併掃入會被當成第 13 個月，且數值為全廠總計，造成金額暴增。
  const groups=[];
  for(let c=0;c<mrow.length;c++){
    const v=mrow[c];
    if(typeof v!=='string')continue;
    const mi=MN.findIndex(m=>new RegExp('^'+m.slice(0,3),'i').test(v.trim()));
    if(mi<0)continue;
    let cP=-1,cH=-1,cE=-1;
    for(let k=c;k<Math.min(c+4,hdr.length);k++){
      const h=String(hdr[k]||'').trim();
      if(/^ppl$/i.test(h)&&cP<0)cP=k;
      else if(/^hour/i.test(h)&&cH<0)cH=k;
      else if(/^expense/i.test(h)&&cE<0)cE=k;
    }
    if(cP<0&&cE<0)continue;
    groups.push({month:mi+1,cP:cP<0?c:cP,cH,cE});
  }
  if(!groups.length)return null;

  // 部門欄：PPl 左側最近的一欄，取表頭列或其左的文字欄
  const cDept=Math.max(0,groups[0].cP-1);

  // 年份：工作表名優先
  let year=0;
  const my=String(sheetName).match(/(20\d{2})/);
  if(my)year=+my[1];
  if(!year){
    for(let i=0;i<hr;i++) for(const c of (raw[i]||[]))
      if(typeof c==='string'){const m=c.match(/(20\d{2})/);if(m){year=+m[1];break;}}
  }
  if(!year)return null;

  // 類型：有 Hour 欄 → 加班；否則獎金
  const hasHour=groups.some(g=>g.cH>=0);
  const type=hasHour?'ot':'bonus';

  const out=[];
  for(let i=hr+1;i<raw.length;i++){
    const r=raw[i]||[];
    const dept=String(r[cDept]||'').trim();
    if(!dept)continue;
    // ⚠ 表格底部有「TTL」總計列，其值等於各部門加總；
    //    若不排除會使整年金額變成兩倍。
    if(/^(ttl|t\/l|total|grand\s*total|sub\s*total|subtotal|合計|小計|總計|總合|總計數)$/i.test(dept))continue;
    groups.forEach(g=>{
      const ppl=N(r[g.cP]), hour=g.cH>=0?N(r[g.cH]):0, exp=g.cE>=0?N(r[g.cE]):0;
      if(ppl===0&&hour===0&&exp===0)return;
      out.push({type,year,month:g.month,dept,ppl,hour,expense:exp});
    });
  }
  return out.length?out:null;
}
function parseWorkbook(wb,fileName){
  let all=[];
  wb.SheetNames.forEach(sn=>{
    const r=parseOtBonusSheet(wb.Sheets[sn],sn);
    if(r)all=all.concat(r);
  });
  if(!all.length)return null;
  // 檔名可覆寫類型判定
  const n=String(fileName||'').toLowerCase();
  if(/bonus|獎金/.test(n)) all.forEach(r=>r.type='bonus');
  else if(/overtime|\bot\b|加班/.test(n)) all.forEach(r=>r.type='ot');
  all.forEach(r=>r.src=fileName||'');
  return all;
}

// ━━━━━━━━━ 智慧匯入 ━━━━━━━━━
async function smartImport(input){
  const files=[...input.files]; input.value='';
  if(!files.length)return;
  const st=qs('#smart-status'), rep=qs('#smart-report');
  st.textContent=T(`⏳ 解析 ${files.length} 個檔案中…`,`⏳ Parsing ${files.length} file(s)…`);
  st.style.color='#0f766e'; rep.classList.add('hidden'); rep.innerHTML='';

  const log=[];
  for(const file of files){
    try{
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',raw:true});
      const recs=parseWorkbook(wb,file.name);
      if(!recs){ log.push({ok:false,f:file.name,msg:T('無法辨識格式（找不到 PPl / Expense 欄）','Unrecognised format')}); continue; }
      // 覆蓋同類型同年度的舊資料
      const years=[...new Set(recs.map(r=>r.year))];
      const type=recs[0].type;
      RECS=RECS.filter(r=>!(r.type===type&&years.includes(r.year)));
      RECS=RECS.concat(recs);
      const exp=recs.reduce((s,r)=>s+r.expense,0);
      log.push({ok:true,f:file.name,type,years,n:recs.length,exp,
                depts:new Set(recs.map(r=>r.dept)).size});
    }catch(e){ log.push({ok:false,f:file.name,msg:e.message}); }
  }
  await idbSaveAll();
  const ps=periods();
  if(ps.length) ACTIVE=ps[ps.length-1];
  showApp(); renderAll(); pushProjection();

  const okN=log.filter(l=>l.ok).length;
  st.textContent = okN===log.length
    ? T(`✅ ${okN} 個檔案全部匯入成功`,`✅ All ${okN} file(s) imported`)
    : T(`⚠ ${okN}/${log.length} 個成功`,`⚠ ${okN}/${log.length} succeeded`);
  st.style.color = okN===log.length?'#059669':'#b45309';

  const hasOt=RECS.some(r=>r.type==='ot'), hasBn=RECS.some(r=>r.type==='bonus');
  const gaps=[];
  if(!hasOt)gaps.push(T('尚無加班表','no Overtime file'));
  if(!hasBn)gaps.push(T('尚無獎金表','no Bonus file'));

  rep.innerHTML=log.map(l=>l.ok
    ? `<div class="flex items-start gap-2"><span class="text-emerald-600">✓</span><span class="flex-1"><b>${esc(l.f)}</b> → ${
        l.type==='ot'?`<span class="text-teal-700 font-semibold">${T('加班 Overtime','Overtime')}</span>`
                     :`<span class="text-amber-700 font-semibold">${T('獎金 Bonus','Bonus')}</span>`
      } · ${l.years.join(', ')} · ${l.n} ${T('筆','rows')} · ${l.depts} ${T('部門','depts')} · $${fmt(l.exp)}</span></div>`
    : `<div class="flex items-start gap-2"><span class="text-rose-600">✕</span><span class="flex-1"><b>${esc(l.f)}</b> — ${esc(l.msg)}</span></div>`
  ).join('')
  + (gaps.length
    ? `<div class="mt-1.5 pt-1.5 border-t border-slate-100 text-amber-700">📌 <b>${T('備註','Note')}</b>：${gaps.join('；')}。<span class="text-slate-500">${T('缺檔不影響已匯入的部分。','Missing files do not affect imported data.')}</span></div>`
    : `<div class="mt-1.5 pt-1.5 border-t border-slate-100 text-emerald-700">📌 ${T('加班表與獎金表皆已載入。','Both Overtime and Bonus files loaded.')}</div>`);
  rep.classList.remove('hidden');
  applyLang();
}

// ━━━━━━━━━ 篩選與彙總 ━━━━━━━━━
function typedRecs(){
  const d=qs('#sel-dept')?qs('#sel-dept').value:'';
  return RECS.filter(r=>(TYPE==='both'||r.type===TYPE)&&(!d||r.dept===d));
}
function periods(){
  return [...new Set(typedRecs().map(r=>`${r.year}-${pad(r.month)}`))].sort();
}
function allPeriods(){
  return [...new Set(RECS.map(r=>`${r.year}-${pad(r.month)}`))].sort();
}
// 月金額 → 選定時間單位
// ⚠ timeSeries() 已依單位完成分組彙總（每季 = 該季三個月加總、每年 = 全年加總），
//    因此係數只負責「由月再細分成日／週」，季與年一律為 1，否則會重複放大 3 倍／12 倍。
const UNIT_F={day:1/WORK_DAYS, week:1/WEEKS, month:1, quarter:1, year:1};
const UNIT_ZH={day:'每日',week:'每週',month:'每月',quarter:'每季',year:'每年'};
const UNIT_EN={day:'Daily',week:'Weekly',month:'Monthly',quarter:'Quarterly',year:'Yearly'};

function _btn(on,color){return on
  ?`text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-semibold text-${color}-700 transition`
  :'text-xs px-3 py-1.5 rounded-md text-slate-500 font-medium transition';}
function setType(t){
  TYPE=t;
  qs('#ct-ot').className=_btn(t==='ot','teal');
  qs('#ct-bonus').className=_btn(t==='bonus','amber');
  qs('#ct-both').className=_btn(t==='both','sky');
  renderAll();
}
function setUnit(u){
  UNIT=u;
  ['day','week','month','quarter','year'].forEach(k=>qs('#cu-'+k).className=_btn(k===u,'teal'));
  renderAll();
}
function setMode(m){
  MODE=m;
  qs('#cm-total').className=_btn(m==='total','sky');
  qs('#cm-cap').className=_btn(m==='cap','sky');
  renderAll();
}
function setReportMode(m){
  REPORT_MODE=m;
  ['month','quarter','year'].forEach(k=>qs('#rp-'+k).className=_btn(k===m,'teal'));
  renderReport();
}
function jumpPeriod(p){ if(p){ACTIVE=p;renderAll();} }
function stepPeriod(dir){
  const ps=periods(); if(!ps.length)return;
  const i=ps.indexOf(ACTIVE);
  const n=Math.min(ps.length-1,Math.max(0,(i<0?ps.length-1:i)+dir));
  if(n!==i) jumpPeriod(ps[n]);
}

const TABS=['dash','time','dept','cmp','report'];
function goTab(name){
  TABS.forEach(t=>{
    qs('#pane-'+t).classList.toggle('hidden',t!==name);
    qs('#tab-'+t).className=(t===name?'tab-active':'tab-inactive')+' text-sm px-4 py-3 whitespace-nowrap transition';
  });
  renderAll();
}
function showApp(){
  const has=RECS.length>0;
  qs('#empty-state').classList.toggle('hidden',has);
  qs('#app').classList.toggle('hidden',!has);
}
function destroyChart(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }

// ━━━━━━━━━ 主渲染 ━━━━━━━━━
function renderAll(){
  if(!RECS.length){showApp();return;}
  showApp();
  buildDeptSelect();
  const ps=periods();
  if(!ACTIVE||!ps.includes(ACTIVE)) ACTIVE=ps[ps.length-1];
  renderNav();
  renderDash();
  renderTime();
  renderDept();
  renderCmp();
  renderReport();
}
function buildDeptSelect(){
  const sel=qs('#sel-dept'), keep=sel.value;
  const ds=[...new Set(RECS.filter(r=>TYPE==='both'||r.type===TYPE).map(r=>r.dept))].sort();
  sel.innerHTML=`<option value="">${T('全廠 All Departments','All Departments')}</option>`
    +ds.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
  if(keep&&ds.includes(keep))sel.value=keep;
}
function renderNav(){
  const ps=periods(), sel=qs('#nav-period');
  sel.innerHTML=ps.slice().reverse().map(p=>{
    const [y,m]=p.split('-');
    return `<option value="${p}">${MS[+m-1]} ${y}</option>`;
  }).join('');
  if(ACTIVE)sel.value=ACTIVE;
  const i=ps.indexOf(ACTIVE);
  const hasOt=RECS.some(r=>r.type==='ot'), hasBn=RECS.some(r=>r.type==='bonus');
  qs('#nav-hint').innerHTML=`<span class="text-slate-400">${i+1} / ${ps.length}</span> `
    +(hasOt?`<span class="text-teal-600">✓ ${T('加班','OT')}</span>`:`<span class="text-slate-400">— ${T('無加班表','no OT')}</span>`)
    +' · '
    +(hasBn?`<span class="text-amber-600">✓ ${T('獎金','Bonus')}</span>`:`<span class="text-slate-400">— ${T('無獎金表','no Bonus')}</span>`);
}

// 依目前時間單位，取出「包含 ACTIVE 的整個區間」的記錄
function unitSpanRecs(){
  const recs=typedRecs();
  if(!ACTIVE)return recs;
  const [ay,am]=ACTIVE.split('-').map(Number);
  if(UNIT==='year')    return recs.filter(r=>r.year===ay);
  if(UNIT==='quarter'){const q=Math.floor((am-1)/3);
    return recs.filter(r=>r.year===ay&&Math.floor((r.month-1)/3)===q);}
  return recs.filter(r=>r.year===ay&&r.month===am);   // 日／週／月皆以該月為基數
}
function unitSpanLabel(){
  if(!ACTIVE)return '';
  const [ay,am]=ACTIVE.split('-').map(Number);
  if(UNIT==='year')return String(ay);
  if(UNIT==='quarter')return `${ay} Q${Math.floor((am-1)/3)+1}`;
  return `${MS[am-1]} ${ay}`;
}

// ── 儀表板 ──
function renderDash(){
  const recs=unitSpanRecs();
  const F=UNIT_F[UNIT], perCap=(MODE==='cap');
  const exp=recs.reduce((s,r)=>s+r.expense,0);
  const ppl=recs.reduce((s,r)=>s+r.ppl,0);
  const hr =recs.reduce((s,r)=>s+r.hour,0);
  const div=perCap?(ppl||1):1;
  const uZh=T(UNIT_ZH[UNIT],UNIT_EN[UNIT]);
  const tZh=TYPE==='ot'?T('加班','Overtime'):TYPE==='bonus'?T('獎金','Bonus'):T('加班＋獎金','OT + Bonus');

  qs('#k-exp').textContent='$'+fmt(exp*F/div);
  qs('#k-exp-s').textContent=`${tZh} · ${uZh}`+(perCap?T(' · 每人',' · per person'):'');
  qs('#k-ppl').textContent=int(ppl);
  qs('#k-ppl-s').textContent=T(`${recs.length} 筆部門記錄`,`${recs.length} dept rows`);
  qs('#k-hr').textContent=hr?int(hr*F):'—';
  qs('#k-hr-s').textContent=hr?T(`人均 ${(hr/(ppl||1)).toFixed(1)} 小時`,`${(hr/(ppl||1)).toFixed(1)} hr/person`):T('獎金無時數','Bonus has no hours');
  qs('#k-rate').textContent=hr?'$'+fmt(exp/hr):'—';
  qs('#k-rate-s').textContent=hr?T('每加班小時成本','per OT hour'):'—';
  qs('#k-avg').textContent='$'+fmt(exp/(ppl||1)*F);
  qs('#k-avg-s').textContent=T(`每人次 · ${uZh}`,`per person · ${uZh}`);

  qs('#scope-txt').textContent=
    `${tZh} · ${qs('#sel-dept').value||T('全廠','All')} · ${unitSpanLabel()} · ${perCap?T('人均','per capita'):T('總額','total')} · ${uZh}`;

  // 趨勢：依單位彙總全部期間
  const series=timeSeries();
  qs('#trend-note').textContent=T(`以「${uZh}」彙總 · 共 ${series.length} 組`,`Grouped by ${uZh} · ${series.length} groups`);
  const asc=series.slice().reverse();
  destroyChart('trend-chart');
  charts['trend-chart']=new Chart(qs('#trend-chart'),{
    type:'bar',
    data:{labels:asc.map(s=>s.label),datasets:[
      {type:'bar',label:T('支出 USD','Expense USD'),
       data:asc.map(s=>+((perCap?s.expense/(s.ppl||1):s.expense)*F).toFixed(2)),
       backgroundColor:'#0d948899',borderColor:'#0d9488',borderWidth:1,borderRadius:4,yAxisID:'y'},
      {type:'line',label:T('人次','Headcount'),data:asc.map(s=>s.ppl),
       borderColor:'#f59e0b',backgroundColor:'#f59e0b',tension:.3,pointRadius:2,yAxisID:'y1'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:10},boxWidth:12}}},
      scales:{y:{beginAtZero:true,grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},
              y1:{position:'right',beginAtZero:true,grid:{display:false},ticks:{font:{size:10}}},
              x:{grid:{display:false},ticks:{font:{size:9},maxRotation:60}}}}
  });

  // 部門圖
  const dm={};
  recs.forEach(r=>{(dm[r.dept]=dm[r.dept]||{ppl:0,exp:0});dm[r.dept].ppl+=r.ppl;dm[r.dept].exp+=r.expense;});
  const top=Object.entries(dm).sort((a,b)=>b[1].exp-a[1].exp).slice(0,15);
  destroyChart('dept-chart');
  charts['dept-chart']=new Chart(qs('#dept-chart'),{
    type:'bar',
    data:{labels:top.map(([d])=>d.length>18?d.slice(0,18)+'…':d),
      datasets:[{data:top.map(([,v])=>+((perCap?v.exp/(v.ppl||1):v.exp)*F).toFixed(2)),
        backgroundColor:top.map((_,i)=>PALETTE[i%PALETTE.length]+'99'),
        borderColor:top.map((_,i)=>PALETTE[i%PALETTE.length]),borderWidth:1,borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' $'+fmt(c.raw)}}},
      scales:{x:{grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},y:{grid:{display:false},ticks:{font:{size:10}}}}}
  });
}

// ── 依時間單位彙總 ──
function timeSeries(){
  const recs=typedRecs(), g={};
  recs.forEach(r=>{
    let gk,label;
    const q=Math.floor((r.month-1)/3)+1;
    if(UNIT==='year'){ gk=String(r.year); label=String(r.year); }
    else if(UNIT==='quarter'){ gk=`${r.year}-Q${q}`; label=`${r.year} Q${q}`; }
    else { gk=`${r.year}-${pad(r.month)}`; label=`${MS[r.month-1]} ${r.year}`; }
    const t=g[gk]||(g[gk]={key:gk,label,months:new Set(),ppl:0,hour:0,expense:0,depts:new Set()});
    t.months.add(`${r.year}-${pad(r.month)}`);
    t.ppl+=r.ppl; t.hour+=r.hour; t.expense+=r.expense; t.depts.add(r.dept);
  });
  return Object.values(g).sort((a,b)=>a.key<b.key?1:-1);   // 新 → 舊
}

function renderReport(){
  const recs=typedRecs(), g={};
  recs.forEach(r=>{
    const q=Math.floor((r.month-1)/3)+1;
    let gk,label;
    if(REPORT_MODE==='year'){gk=String(r.year);label=String(r.year);}
    else if(REPORT_MODE==='quarter'){gk=`${r.year}-Q${q}`;label=`${r.year} Q${q}`;}
    else{gk=`${r.year}-${pad(r.month)}`;label=`${MS[r.month-1]} ${r.year}`;}
    const t=g[gk]||(g[gk]={key:gk,label,ppl:0,hour:0,exp:0,depts:new Set(),months:new Set()});
    t.ppl+=r.ppl;t.hour+=r.hour;t.exp+=r.expense;t.depts.add(r.dept);
    t.months.add(`${r.year}-${pad(r.month)}`);
  });
  const list=Object.values(g).sort((a,b)=>a.key<b.key?1:-1);
  qs('#rp-count').textContent=`${list.length} ${T('組','groups')}`;
  const perCap=(MODE==='cap');
  qs('#rp-thead').innerHTML=[T('區間','Period'),T('月數','Months'),T('部門數','Depts'),T('人次','Headcount'),
    T('時數','Hours'),T('每日 $','Daily $'),T('每月 $','Monthly $'),T('合計 $','Total $')]
    .map((h,i)=>`<th class="px-3 py-2 ${i?'text-right':'text-left'} font-semibold whitespace-nowrap">${h}</th>`).join('');
  qs('#rp-tbody').innerHTML=list.map(t=>{
    const base=perCap?t.exp/(t.ppl||1):t.exp;
    const perMonth=base/(t.months.size||1);
    const isAct=(REPORT_MODE==='month'&&t.key===ACTIVE);
    return `<tr onclick="${REPORT_MODE==='month'?`jumpPeriod('${t.key}')`:''}"
      class="border-b border-slate-50 ${REPORT_MODE==='month'?'cursor-pointer':''} ${isAct?'bg-teal-50/60':'hover:bg-slate-50'}">
      <td class="px-3 py-2 font-semibold ${isAct?'text-teal-700':'text-slate-700'}">${t.label}${isAct?' ◀':''}</td>
      <td class="px-3 py-2 text-right jmono">${t.months.size}</td>
      <td class="px-3 py-2 text-right jmono">${t.depts.size}</td>
      <td class="px-3 py-2 text-right jmono">${int(t.ppl)}</td>
      <td class="px-3 py-2 text-right jmono ${t.hour?'':'text-slate-300'}">${t.hour?int(t.hour):'—'}</td>
      <td class="px-3 py-2 text-right jmono">$${fmt(perMonth/WORK_DAYS)}</td>
      <td class="px-3 py-2 text-right jmono">$${fmt(perMonth)}</td>
      <td class="px-3 py-2 text-right jmono font-bold text-teal-700">$${fmt(base)}</td></tr>`;
  }).join('')||`<tr><td colspan="8" class="px-3 py-8 text-center text-slate-400">${T('無資料','No data')}</td></tr>`;
}

// ━━━━━━━━━ TELEGRAM ━━━━━━━━━
function buildTgText(type,period){
  const dept=qs('#sel-dept')?qs('#sel-dept').value:'';
  const [y,m]=period.split('-');
  const recs=RECS.filter(r=>(type==='both'||r.type===type)
    && `${r.year}-${pad(r.month)}`===period && (!dept||r.dept===dept));
  if(!recs.length)return{err:T('此期間無資料','No data for this period')};
  const dm={};
  recs.forEach(r=>{(dm[r.dept]=dm[r.dept]||{ppl:0,hour:0,exp:0});
    dm[r.dept].ppl+=r.ppl;dm[r.dept].hour+=r.hour;dm[r.dept].exp+=r.expense;});
  const list=Object.entries(dm).sort((a,b)=>b[1].exp-a[1].exp);
  const tExp=list.reduce((s,[,v])=>s+v.exp,0);
  const tPpl=list.reduce((s,[,v])=>s+v.ppl,0);
  const tHr =list.reduce((s,[,v])=>s+v.hour,0);
  const head=type==='ot'?'⏱ <b>加班支出 Overtime</b>'
           :type==='bonus'?'🎁 <b>生產獎金 Production Bonus</b>'
           :'📊 <b>加班＋獎金合計 OT + Bonus</b>';
  let t=`${head}\n📅 期間 Period：${MS[+m-1]} ${y}\n`
   +`🏭 部門 Depts：${list.length}　👥 人次 Headcount：${int(tPpl)}\n`
   +(tHr?`⏱ 加班時數 OT Hours：${int(tHr)}　（$${fmt(tExp/tHr)}/hr）\n`:'')
   +`💵 <b>支出總額 Total：$${fmt(tExp)}</b>\n`
   +`— — — — — — — — — —\n<b>各部門明細 By Department</b>\n`
   +`<i>部門 Dept ｜ 人次 Staff ｜ 金額 Amount</i>\n`;
  list.forEach(([d,v])=>{ t+=`${esc(d)}：${int(v.ppl)} 人次 · $${fmt(v.exp)}\n`; });
  t+=`— — — — — — — — — —\n合計 TOTAL：${int(tPpl)} 人次 · <b>$${fmt(tExp)}</b>`;
  if(dept) t+=`\n\n🔎 ${T('已篩選部門','Filtered dept')}：${esc(dept)}`;
  return {text:t};
}
function openTgModal(){
  const ps=allPeriods().reverse();
  if(!ps.length){toast(T('尚無資料','No data yet'),'error');return;}
  qs('#tg-type').value=TYPE;
  const sel=qs('#tg-period');
  sel.innerHTML=ps.map(p=>{const [y,m]=p.split('-');return `<option value="${p}">${MS[+m-1]} ${y}</option>`;}).join('');
  sel.value=(ACTIVE&&ps.includes(ACTIVE))?ACTIVE:ps[0];
  previewTg();
  const md=qs('#tg-modal'); md.classList.remove('hidden'); md.classList.add('flex');
  applyLang();
}
function closeTgModal(){const m=qs('#tg-modal');m.classList.add('hidden');m.classList.remove('flex');}
function previewTg(){
  const r=buildTgText(qs('#tg-type').value,qs('#tg-period').value);
  const pv=qs('#tg-preview'), btn=qs('#tg-send');
  if(r.err){pv.textContent='⚠️ '+r.err;btn.disabled=true;
    btn.className='flex-1 text-xs font-bold px-3 py-2.5 rounded-lg bg-slate-200 text-slate-400 cursor-not-allowed';}
  else{pv.textContent=r.text.replace(/<\/?b>/g,'').replace(/<\/?i>/g,'');btn.disabled=false;
    btn.className='flex-1 text-xs font-bold px-3 py-2.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700 transition';}
}
async function confirmSendTg(){
  const r=buildTgText(qs('#tg-type').value,qs('#tg-period').value);
  if(r.err){toast(r.err,'error');return;}
  const btn=qs('#tg-send'); btn.disabled=true; btn.textContent=T('傳送中…','Sending…');
  const ok=await sendTG(r.text);
  btn.disabled=false; btn.textContent=T('確認傳送','Send');
  if(ok)closeTgModal();
}
async function sendTG(text){
  if(!GAS_URL){toast(T('尚未設定 GAS URL','GAS URL not set'),'error');return false;}
  if(!text||!text.trim()){toast(T('訊息內容是空的，未送出','Message empty'),'error');return false;}
  try{
    const r=await fetch(GAS_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type:'notify',text})});
    let d=null; try{d=await r.json();}catch(e){}
    if(d&&d.sent===false){toast(T('GAS 回報未送出，請確認 Bot 在群組內','GAS reported not sent'),'error');return false;}
    toast(T('已傳送至 Telegram 群組','Sent to Telegram group'),'success');return true;
  }catch(e){toast(T('傳送失敗：','Send failed: ')+e.message,'error');return false;}
}

// ━━━━━━━━━ 雲端 / Projection ━━━━━━━━━
//  註：OT/Bonus 為部門級資料，依規格不產生員工級 Projection，
//      僅上傳部門彙總供 Summary Center 參考。
async function pushProjection(){
  try{
    const byPeriod={};
    RECS.forEach(r=>{
      const k=`${r.year}-${pad(r.month)}:${r.type}`;
      (byPeriod[k]=byPeriod[k]||{period:`${r.year}-${pad(r.month)}`,type:r.type,rows:[]})
        .rows.push({dept:r.dept,ppl:r.ppl,hour:r.hour,expense:r.expense});
    });
    localStorage.setItem('hrpay:result:ot_bonus',JSON.stringify({
      module:'ot_bonus',updatedAt:_nowISO(),level:'department',
      groups:Object.values(byPeriod)
    }));
  }catch(e){console.warn(e);}
}
async function cloudUpload(){
  if(!RECS.length){toast(T('尚無資料可上傳','Nothing to upload'),'error');return;}
  const b=qs('#btn-cloud-up'); b.disabled=true; b.classList.add('opacity-50');
  try{
    await pushProjection();
    await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({tool:'hrpay_ot_bonus',updatedAt:_nowISO(),records:RECS})});
    toast(T('☁ 已上傳雲端','☁ Uploaded'),'success');
  }catch(e){toast(T('上傳失敗：','Upload failed: ')+e.message,'error');}
  b.disabled=false; b.classList.remove('opacity-50');
}
async function cloudDownload(){
  const b=qs('#btn-cloud-down'); b.disabled=true; b.classList.add('opacity-50');
  try{
    const r=await fetch(GAS_URL+'?action=pull&tool=hrpay_ot_bonus');
    const d=await r.json();
    const arr=(d&&d.data&&d.data.records)||[];
    if(!arr.length)toast(T('雲端尚無資料','No cloud data'),'warning');
    else{
      RECS=arr; await idbSaveAll();
      const ps=periods(); ACTIVE=ps[ps.length-1];
      renderAll();
      toast(T(`☁ 已載入 ${arr.length} 筆記錄`,`☁ Loaded ${arr.length} rows`),'success');
    }
  }catch(e){toast(T('下載失敗：','Download failed: ')+e.message,'error');}
  b.disabled=false; b.classList.remove('opacity-50');
}

// ━━━━━━━━━ 其他 ━━━━━━━━━
function exportCSV(which){
  const tbl=which==='dept'?qs('#pane-dept table'):qs('#pane-time table');
  const rows=[...tbl.querySelectorAll('tr')].map(tr=>
    [...tr.children].map(td=>`"${td.textContent.trim().replace(/"/g,'""')}"`).join(','));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`ot_bonus_${which}_${TYPE}_${ACTIVE||'all'}.csv`;a.click();
  toast(T('CSV 已下載','CSV downloaded'),'success');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(RECS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`ot_bonus_backup_${_nowISO().slice(0,10)}.json`;a.click();
}
async function clearAllData(){
  if(!confirm(T('確定清除所有已匯入的加班與獎金資料？','Clear all imported OT and Bonus data?')))return;
  RECS=[];ACTIVE=null;await idbClear();
  localStorage.removeItem('hrpay:result:ot_bonus');
  qs('#smart-report').classList.add('hidden');qs('#smart-status').textContent='';
  showApp();
  toast(T('資料已清除','Data cleared'),'warning');
}

// ━━━━━━━━━ 啟動 ━━━━━━━━━
(async function init(){
  RECS=await idbLoad();
  const ps=periods();
  if(ps.length)ACTIVE=ps[ps.length-1];
  showApp();
  if(RECS.length)renderAll();
  applyLang();
})();

// ━━━━━━━━━ 拖放上傳 Drag & Drop ━━━━━━━━━
//  <label> 內的 file input 不會自動接收拖放，需自行掛載事件。
//  同時攔截整個視窗的拖放，避免瀏覽器直接開啟檔案。
function setupDropZone(sel, handler, ringCls){
  const el=document.querySelector(sel); if(!el)return;
  const stop=e=>{e.preventDefault();e.stopPropagation();};
  ['dragenter','dragover','dragleave','drop'].forEach(ev=>el.addEventListener(ev,stop,false));
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,()=>{
    el.classList.add('ring-2','ring-offset-2',ringCls);}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,()=>{
    el.classList.remove('ring-2','ring-offset-2',ringCls);}));
  el.addEventListener('drop',e=>{
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])]
      .filter(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name));
    if(files.length) handler({files, value:''});
    else toast(T('請拖入 Excel 或 CSV 檔','Please drop an Excel or CSV file'),'warning');
  },false);
  // 視窗層級：拖到非放置區時不要讓瀏覽器開檔
  ['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{
    if(!el.contains(e.target)) e.preventDefault();},false));
}

setupDropZone('#dz-smart-ob', smartImport, 'ring-teal-400');
</script>
